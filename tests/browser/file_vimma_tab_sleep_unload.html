<!-- Fixture for browser_vimma_tab_sleep.js: a web editor that asks before the page goes while
   - its text area holds unsaved text. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>vimma tab sleep unsaved</title>
  </head>
  <body>
    <textarea id="draft"></textarea>
    <script>
      addEventListener("beforeunload", (e) => {
        if (document.getElementById("draft").value) e.preventDefault();
      });
    </script>
  </body>
</html>
