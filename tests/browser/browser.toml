[DEFAULT]
support-files = ["head.js"]
# Hermetic colours: the developer's own Omarchy theme must not reach other tests' assertions.
# browser_vimma_theme.js turns it back on for its fixtures (spec m5-omarchy-theme).
# The same for config.toml: the developer's own file must not rebind keys under other tests
# (m5-config-load); browser_vimma_config.js points the path at its own temporary file.
prefs = ["vimma.theme.source=builtin", "vimma.config.path=/nonexistent/vimma-test/config.toml"]

["browser_vimma_help_overlay.js"]
support-files = ["file_vimma_test.pdf"]

["browser_vimma_key_capture.js"]

["browser_vimma_insert_scroll.js"]
support-files = [
  "file_vimma_insert_scroll.html",
  "file_vimma_frame.html",
  "file_vimma_design.html",
  "file_vimma_design_host.html",
  "file_vimma_plain.html",
  "file_vimma_test.pdf",
]

["browser_vimma_insert_focus.js"]
support-files = [
  "file_vimma_insert_focus.html",
  "file_vimma_insert_autofocus.html",
  "file_vimma_insert_tab_frame.html",
  "file_vimma_insert_trap.html",
  "file_vimma_frame.html",
]

["browser_vimma_hints.js"]
support-files = [
  "file_vimma_hints.html",
  "file_vimma_hints_frame.html",
  "file_vimma_hints_many.html",
  "file_vimma_hints_menu.html",
]

["browser_vimma_copy_mode.js"]
support-files = ["file_vimma_copy.html", "file_vimma_copy_frame.html"]

["browser_vimma_copy_motions.js"]
support-files = ["file_vimma_copy_motions.html"]

["browser_vimma_copy_mouse.js"]
support-files = ["file_vimma_copy_motions.html"]

["browser_vimma_branding.js"]

["browser_vimma_user_agent.js"]

["browser_vimma_mozilla_services.js"]

["browser_vimma_safebrowsing.js"]

["browser_vimma_wake_lock.js"]

["browser_vimma_crash_reporter.js"]
# Artifact builds run Mozilla's libxul, built with the crash reporter (ADR-010).
skip-if = ["artifact"]

["browser_vimma_app_version.js"]

["browser_vimma_version_line.js"]
# The --version line is C++ (nsAppRunner-cpp.patch); artifact builds run Mozilla's libxul (ADR-010).
skip-if = ["artifact"]

["browser_vimma_tabstrip.js"]

["browser_vimma_toolbar.js"]
support-files = ["file_vimma_plain.html", "file_vimma_mixed.js"]

["browser_vimma_toolbar_theme.js"]
support-files = ["file_vimma_plain.html"]

["browser_vimma_firefox_surfaces_theme.js"]
support-files = ["file_vimma_plain.html"]

["browser_vimma_tab_keys.js"]
support-files = ["file_vimma_test.pdf"]

["browser_vimma_system_addons.js"]
support-files = ["head_vimma_aus.js"]

["browser_vimma_updater.js"]
support-files = ["head_vimma_aus.js"]
# Artifact builds run Mozilla's libxul, built with the updater (ADR-010).
skip-if = ["artifact"]

["browser_vimma_split_contract.js"]

["browser_vimma_split_layout.js"]

["browser_vimma_focus_accent.js"]

["browser_vimma_focus_rings.js"]

["browser_vimma_pane_keys.js"]

["browser_vimma_pane_swap_resize.js"]

["browser_vimma_pane_focus.js"]

["browser_vimma_focus_urlbar.js"]
support-files = [
