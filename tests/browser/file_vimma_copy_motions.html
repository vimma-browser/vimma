<!-- Fixture for browser_vimma_copy_motions.js and browser_vimma_copy_mouse.js: known words,
   - an indented preformatted line, a line of separators, two paragraphs (one with inline
   - markup), a paragraph laid out over several source lines before a list, lines broken by
   - <br>, a text field, a link and a paragraph that selects itself when clicked (a page's own,
   - programmatic selection). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>vimma copy motions</title>
    <style>
      body {
        font: 16px/1.5 monospace;
        margin: 0;
      }
      p,
      pre {
        margin: 0 0 8px;
      }
    </style>
  </head>
  <body>
    <p id="words">alpha beta.gamma delta</p>
    <pre id="pre">    indented line</pre>
    <p id="find">one,two,three;four</p>
    <p id="para1">first paragraph <b>bold</b>word end.</p>
    <p id="para2">second paragraph here.</p>
    <!-- prettier-ignore -->
    <p id="intro">
      a paragraph before a list
    </p>
    <ul id="list">
      <li id="item1">first item</li>
      <li id="item2">second item</li>
    </ul>
    <p id="lines">line one<br />line two<br />line three</p>
    <p><input id="field" value="field text here" /></p>
    <p><a id="link" href="#linked">a link to follow</a></p>
    <p id="selectme" onclick="getSelection().selectAllChildren(this)">a click selects me</p>
  </body>
</html>
