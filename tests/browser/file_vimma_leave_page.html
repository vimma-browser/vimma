<!-- Fixture for browser_vimma_dialog_keys.js: a page with unsaved changes, whose beforeunload
   - handler makes Firefox ask "Leave page?" before the tab closes. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>vimma leave page</title>
  </head>
  <body>
    <p>Unsaved changes.</p>
    <script>
      window.addEventListener("beforeunload", (e) => e.preventDefault());
    </script>
  </body>
</html>
