<!-- Fixture for browser_vimma_hints_scroll.js: links in a page that scrolls by mandatory snap
   - points 500 px apart (`?snap`), in an inner scroller that has focus (`?inner`), or down a
   - plain page. `carousel` adds a strip in the top right corner that the page's script scrolls
   - every frame; `consume` makes the page take every wheel for itself, as a map does; `jack` takes
   - every wheel and scrolls the page itself on the next frame; `preventfirst` takes only the
   - first wheel; `glide` puts the links in a
   - frame that the page moves with a transform on each wheel. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>vimma hints scroll</title>
    <style>
      body {
        margin: 0;
        font: 16px/20px sans-serif;
      }
      a {
        display: block;
      }
      .snap {
        scroll-snap-type: y mandatory;
      }
      .snap section {
        height: 500px;
        scroll-snap-align: start;
      }
      #box {
        height: 300px;
        overflow: auto;
        margin: 40px;
      }
      #strip {
        position: fixed;
        top: 0;
        right: 0;
        width: 200px;
        height: 40px;
        overflow-x: auto;
        white-space: nowrap;
        background: #eee;
      }
    </style>
  </head>
  <body>
    <script>
      const has = (flag) => location.search.includes(flag);
      const html = [];
      if (has("snap")) {
        document.documentElement.className = "snap";
        for (let s = 0; s < 20; s++) {
          const links = [];
          for (let i = 0; i < 20; i++)
            links.push(`<a href="#s${s}-${i}">section ${s} link ${i}</a>`);
          html.push(`<section>${links.join("")}</section>`);
        }
        document.body.innerHTML = html.join("");
      } else if (has("inner")) {
        for (let i = 0; i < 300; i++) html.push(`<a href="#b${i}">box link ${i}</a>`);
        document.body.innerHTML = `<div id="box" tabindex="-1">${html.join("")}</div>`;
      } else if (has("glide")) {
        // Links only in a frame, in a wrapper the page moves itself for each wheel, as smooth
        // scrolling libraries do with a transform: the page never scrolls.
        const links = [];
        for (let i = 0; i < 40; i++)
          links.push(`<a href="#f${i}" style="display:block">frame link ${i}</a>`);
        const frame = document.createElement("iframe");
        frame.srcdoc = `<body style="margin:0;font:16px/20px sans-serif">${links.join("")}</body>`;
        frame.style.cssText = "display:block;width:300px;height:500px;border:0";
        const wrapper = document.createElement("div");
        wrapper.id = "glide";
        wrapper.style.cssText = "position:fixed;top:200px;left:0;width:100%";
        wrapper.append(frame);
        document.body.append(wrapper);
        let y = 0;
        window.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            y = Math.max(-150, Math.min(0, y - Math.sign(e.deltaY) * 100));
            wrapper.style.transform = `translateY(${y}px)`;
          },
          { passive: false },
        );
      } else {
        for (let i = 0; i < 600; i++) html.push(`<a href="#p${i}">page link ${i}</a>`);
        document.body.innerHTML = html.join("");
      }
      if (has("carousel")) {
        const strip = document.createElement("div");
        strip.id = "strip";
        for (let i = 0; i < 40; i++) {
          const item = document.createElement("span");
          item.textContent = `slide ${i} `;
          strip.append(item);
        }
        document.body.append(strip);
        const step = () => {
          strip.scrollLeft = (strip.scrollLeft + 3) % strip.scrollLeftMax;
          requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }
      if (has("consume")) {
        window.addEventListener("wheel", (e) => e.preventDefault(), { passive: false });
      }
      if (has("jack")) {
        // A smooth-scrolling library: it takes the wheel and scrolls the page itself on the
        // next frame.
        window.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            requestAnimationFrame(() => window.scrollBy(0, e.deltaY));
          },
          { passive: false },
        );
      }
      if (has("preventfirst")) {
        // Takes only the first wheel (a modal that locked the page, closed since).
        let first = true;
        window.addEventListener(
          "wheel",
          (e) => {
            if (first) e.preventDefault();
            first = false;
          },
          { passive: false },
        );
      }
    </script>
  </body>
</html>
