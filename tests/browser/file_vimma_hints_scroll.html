<!-- Fixture for browser_vimma_hints_scroll.js: links in a page that scrolls by mandatory snap
   - points 500 px apart (`?snap`), or in an inner scroller that has focus (`?inner`). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>vimma hints scroll</title>
    <style>
      body {
        margin: 0;
        font: 16px/20px sans-serif;
      }
      a {
        display: block;
      }
      .snap {
        scroll-snap-type: y mandatory;
      }
      .snap section {
        height: 500px;
        scroll-snap-align: start;
      }
      #box {
        height: 300px;
        overflow: auto;
        margin: 40px;
      }
    </style>
  </head>
  <body>
    <script>
      const snap = location.search.includes("snap");
      const html = [];
      if (snap) {
        document.documentElement.className = "snap";
        for (let s = 0; s < 20; s++) {
          const links = [];
          for (let i = 0; i < 20; i++)
            links.push(`<a href="#s${s}-${i}">section ${s} link ${i}</a>`);
          html.push(`<section>${links.join("")}</section>`);
        }
        document.body.innerHTML = html.join("");
      } else {
        for (let i = 0; i < 300; i++) html.push(`<a href="#b${i}">box link ${i}</a>`);
        document.body.innerHTML = `<div id="box" tabindex="-1">${html.join("")}</div>`;
      }
    </script>
  </body>
</html>
