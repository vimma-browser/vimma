<!-- Fixture for browser_vimma_element.js: ip and ap in copy mode. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>vimma element paragraphs</title>
  </head>
  <body>
    <article id="article">
      <h2 id="title">An article</h2>
      <section id="section">
        <p id="s1">The section's first paragraph.</p>
        <p id="s2">The second paragraph, with <em id="em">emphasis</em> in it.</p>
        <pre id="code"><div>first line</div><div id="line2">second line</div></pre>
      </section>
      <p id="after">A paragraph after the section.</p>
    </article>
    <p id="outside">A paragraph outside the article.</p>
  </body>
</html>
