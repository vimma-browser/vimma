<!-- Fixture for browser_vimma_mcp_elements.js: search results shaped like Finnish grocery
   - shops' (issue #693). Each card names its product in a heading, shows the price apart, and has
   - an add button that shows only an icon or a word the other cards share. -->
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <title>Cards agent fixture</title>
    <style>
      article {
        display: inline-block;
        width: 180px;
        margin: 4px;
        border: 1px solid;
      }
      h3 {
        font-size: 14px;
        margin: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h2>Hakutulokset</h2>
      <article>
        <h3>Kaurajuoma 1 l</h3>
        <span>0,75 €</span>
        <button aria-label="Lisää Kaurajuoma 1 l ostoskoriin">+</button>
      </article>
      <article>
        <h3>Kauramaito luomu 1 l</h3>
        <span>0,85 €</span>
        <button aria-label="Lisää Kauramaito luomu 1 l ostoskoriin">+</button>
      </article>
      <article>
        <div><h3 id="tofu">Tofu maustamaton 250 g</h3></div>
        <span>1,99 €</span>
        <div><button aria-labelledby="add-word tofu">+</button></div>
      </article>
      <article>
        <h3><a href="#kikherne">Kikherneet 380 g</a></h3>
        <span>0,89 €</span>
        <div><button>Lisää</button></div>
      </article>
      <article>
        <h3><a href="#spagetti">Spagetti 500 g</a></h3>
        <span>0,59 €</span>
        <div><button>Lisää</button></div>
      </article>
      <article>
        <h3>Banaani</h3>
        <span>1,49 €/kg</span>
        <button aria-label="Osta">Osta</button>
      </article>
    </main>
    <span id="add-word" hidden>Lisää ostoskoriin</span>
    <footer>
      <button>Näytä lisää</button>
      <button>Näytä lisää</button>
    </footer>
  </body>
</html>
