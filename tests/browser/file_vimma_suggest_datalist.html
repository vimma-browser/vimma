<!-- Fixture for browser_vimma_page_suggestions.js: an input with a datalist, whose list
     Firefox draws as #PopupAutoComplete, and the
     keys the page receives in window.log. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>vimma suggest datalist</title>
  </head>
  <body>
    <input id="dl" list="fruits" />
    <datalist id="fruits">
      <option value="banana"></option>
      <option value="blueberry"></option>
    </datalist>
    <script>
      window.log = [];
      document.addEventListener(
        "keydown",
        (e) => {
          const mods = (e.ctrlKey ? "ctrl+" : "") + (e.altKey ? "alt+" : "");
          window.log.push(`${e.target.id}:${mods}${e.key}:${e.isTrusted}`);
        },
        true,
      );
    </script>
  </body>
</html>
