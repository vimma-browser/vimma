<!-- Fixture for browser_vimma_page_suggestions.js: an input with a datalist, whose list
     Firefox draws as #PopupAutoComplete. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>vimma suggest datalist</title>
  </head>
  <body>
    <input id="dl" list="fruits" />
    <datalist id="fruits">
      <option value="banana"></option>
      <option value="blueberry"></option>
    </datalist>
  </body>
</html>
