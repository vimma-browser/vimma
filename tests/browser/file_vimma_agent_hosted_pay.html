<!-- Fixture for browser_vimma_mcp_checkpoint.js: a payment provider's hosted frame of another
   - site, inside file_vimma_agent_checkout.html?frame=hosted_pay, with its own total, a pay
   - button and a pay link, and no card field, as for a saved card. Each click is counted in
   - #log. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hosted payment</title>
    <!-- One small row, so that the controls show in the checkout's 40-pixel-high frame. -->
    <style>
      body {
        margin: 0;
        display: flex;
        gap: 6px;
        align-items: center;
        font: 11px sans-serif;
      }
      ol {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <span>Total 42.90 EUR</span>
    <button id="pay" type="button">Pay 42.90 EUR</button>
    <a href="file_vimma_agent_page.html?bank">Pay by bank</a>
    <ol id="log"></ol>
    <script>
      document.getElementById("pay").addEventListener("click", () => {
        const li = document.createElement("li");
        li.textContent = "pay";
        document.getElementById("log").append(li);
      });
    </script>
  </body>
</html>
