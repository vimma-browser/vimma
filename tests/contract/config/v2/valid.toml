# Contract fixture: a valid schema-2 config touching every section. Must parse without errors.
schema = 2

[keys]
prefix = "ctrl+b"
new_tab = ["prefix+c", "ctrl+alt+c"]
split_vertical = ["prefix+v"]

[workspaces]
work     = { color = "blue",  icon = "briefcase", home = "https://intranet.example" }
personal = { color = "turquoise" }

[modal]
leader = " "
timeout_ms = 800
hint_chars = "jfkdls"

[modal.normal]
"j" = "scroll.down"

[unbind]
normal = ["d"]

[theme]
source = "omarchy"
font = "JetBrainsMono Nerd Font"

[theme.colors]
accent = "#7aa2f7"

[panes]
max = 6
layout = "manual"
main_size = 70

[sites."docs.google.com"]
insert = "always"

[sites."example.com"]
insert = "never"

[sites."[::1]"]

# docs/specs/bookmarks-file.md D2: a workspace's bookmarks inline, beside the settings.
[bookmarks]
root = "workspace"

[bookmarks.work]
"docs/Vimma guide" = "https://vimma.dev/docs"
"archive/" = ""
