<!-- downloads picker (docs/specs/downloads.md): a page that downloads download-report.txt as it
     loads, then titles itself "downloaded", so a scenario waits for the click before it looks. -->
<meta charset="utf-8" />
<title>download</title>
<style>
  html {
    height: 100%;
    background: #e8e8e8;
  }
</style>
<a id="file" href="download-report.txt" download="report.txt"></a>
<script>
  document.getElementById("file").click();
  document.title = "downloaded";
</script>
