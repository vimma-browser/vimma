<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The fontconfig file the e2e harness gives the browser (FONTCONFIG_FILE, tools/e2e/launcher.mjs,
  issue #944). It replaces the system's /etc/fonts/fonts.conf, so the browser sees only the
  DejaVu faces in this folder, and Liberation Sans for Helvetica and Arial, and draws them as CI's ubuntu-24.04 does, whatever fonts and
  settings the machine has. See README.md here.
-->
<fontconfig>
  <!-- this folder, wherever the checkout is -->
  <dir prefix="relative">.</dir>
  <!-- under the browser's HOME, which the harness puts inside the profile -->
  <cachedir prefix="xdg">fontconfig</cachedir>

  <!--
    Rendering as ubuntu-24.04's fontconfig-config sets it: its conf.d links 10-hinting-slight,
    10-yes-antialias, 10-sub-pixel-rgb and 11-lcdfilter-default.
  -->
  <match target="pattern">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

  <!--
    Every family resolves to a DejaVu one: the generic names (GTK's "Sans" for the browser's own
    UI, CSS's monospace, sans-serif, serif and system-ui) by alias, and any other name by falling
    back to sans-serif, as fontconfig's 49-sansserif.conf does.
  -->
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer><family>DejaVu Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>Sans</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>Serif</family>
    <prefer><family>DejaVu Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <!--
    Helvetica and Arial, as fontconfig's 30-metric-aliases.conf maps them on CI, where
    fonts-liberation is installed: a PDF's standard Helvetica (pdf.js draws it with a system font)
    then has Liberation Sans's metrics, not DejaVu Sans's.
  -->
  <alias binding="same">
    <family>Helvetica</family>
    <accept><family>Liberation Sans</family></accept>
  </alias>
  <alias binding="same">
    <family>Arial</family>
    <accept><family>Liberation Sans</family></accept>
  </alias>
  <match target="pattern">
    <test qual="all" name="family" compare="not_eq"><string>sans-serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>monospace</string></test>
    <edit name="family" mode="append_last"><string>sans-serif</string></edit>
  </match>
</fontconfig>
