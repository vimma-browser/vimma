# Release download counts over time (issue #647, docs/runbook.md "Release download counts").
# GitHub keeps one running download_count per release asset and no history, so a jump cannot be
# told apart from our own automation fetching an asset. This records every asset's count once a
# day into downloads.csv on the `stats` branch, an orphan branch that holds only that file, so
# the data stays out of main's history and main's ruleset stays as it is.
#
# Two jobs, so the step that runs repository code never holds a token that can push. The record
# job checks out only the stats branch, runs no repository code, and refuses a file that does
# not begin with the recorded history (append only). No secret: the job token only. Nothing to
# install: the script is Node standard library on the runner's node.
name: downloads

on:
  schedule:
    - cron: "37 23 * * *" # 23:37 UTC daily, near the end of the UTC day the row is dated
  workflow_dispatch:

permissions: {}

# Runs queue rather than cancel: a cancelled record job would lose that day's row.
concurrency:
  group: downloads
  cancel-in-progress: false

jobs:
  collect:
    name: Snapshot the download counts
    if: github.repository == 'vimma-browser/vimma'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # the releases and their assets' counts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The history comes from the public stats branch; a failed fetch fails the run rather
      # than starting a new history.
      - name: Snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p out
          git fetch --no-tags --depth=1 origin stats
          git show FETCH_HEAD:downloads.csv > out/downloads.csv
          node tools/stats/downloads.mjs collect --repo "$REPO" --out out/day.csv
          node tools/stats/downloads.mjs merge --csv out/downloads.csv --day out/day.csv
          node tools/stats/downloads.mjs summary --csv out/downloads.csv --markdown \
            >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downloads
          path: out/downloads.csv
          retention-days: 7

  record:
    name: Commit the snapshot to the stats branch
    needs: collect
    if: ${{ !cancelled() && needs.collect.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push downloads.csv to the stats branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stats
          persist-credentials: true # the push below

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: downloads
          path: ${{ runner.temp }}/new

      - name: Commit
        run: |
          new="$RUNNER_TEMP/new/downloads.csv"
          size=$(stat -c %s downloads.csv)
          if ! cmp -s -n "$size" downloads.csv "$new"; then
            echo "::error::The new downloads.csv does not begin with the recorded history"
            exit 1
          fi
          if cmp -s downloads.csv "$new"; then
            echo "Today's counts are already recorded."
            exit 0
          fi
          cp "$new" downloads.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads.csv
          git commit -q -m "data: release download counts for $(date -u +%F)"
          git push origin HEAD:stats
