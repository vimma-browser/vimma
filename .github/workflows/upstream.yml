# The upstream autopilot (spec m7-upstream-autopilot, ADR-015; before it m0-pipeline and
# m0-rebase-playbook, ADR-002). When Firefox ships a release, above all a security release, it
# rebases Vimma onto it and opens a tested PR with no manual step; a person reviews and merges.
#
#   detect       every 4 h, < 1 min, read-only. Newer release? security (MFSA)? drift?
#                Mozilla's release key changed or about to expire?
#   key          that key change: a `security` issue. Runs gh only.
#   track        a newer release: its tracking issue, labelled upstream (+ security).
#   patch-check  stream + SHA-512-verify the source tarball, dry-run our patches, patch audit,
#                artifact preflight. Read-only.
#   test         e2e.yml (workflow_call) on the bumped surfer.json: import, artifact build,
#                tests/browser/ and tests/e2e/. Read-only. Only when every patch applies and
#                Mozilla's artifacts exist.
#   publish      push upstream/firefox-X.Y.Z and open the PR (a draft unless all green and CI
#                can run), or, when Actions may not open PRs, comment a compare link on the issue.
#   drift        Vimma past the drift limit (docs/security.md, G2): issue + a failing run.
#
# The heavy jobs run once per release: when the upstream/firefox-X.Y.Z branch exists the
# release has been handled (rerun with `gh workflow run upstream.yml -f rebuild=true`).
# Detection reads public Mozilla feeds and needs no secret; no job gets SAFEBROWSING_API_KEY.
# Never pull_request_target: nothing here runs code from a PR.
name: upstream

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebase and test again even if upstream/firefox-X.Y.Z exists (it is rebuilt)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: upstream
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # surfer.json, tools/upstream; the branch lookup
      issues: read # the tracking and drift issues; the Beta canary's issues
    outputs:
      version: ${{ steps.detect.outputs.version }}
      labels: ${{ steps.detect.outputs.labels }}
      security: ${{ steps.detect.outputs.security }}
      drift: ${{ steps.detect.outputs.drift }}
      drift-line: ${{ steps.detect.outputs.drift-line }}
      detection: ${{ steps.detect.outputs.detection }}
      rebase: ${{ steps.state.outputs.rebase }}
      issue: ${{ steps.state.outputs.issue }}
      track: ${{ steps.state.outputs.track }}
      beta-issues: ${{ steps.beta.outputs.beta-issues }}
      key-title: ${{ steps.key.outputs.key-title }}
      key-report: ${{ steps.key.outputs.key-report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/upstream # and the root files, surfer.json among them

      # Spec build-supply-chain, decision 21 (docs/security.md, B7): a new subkey, a new
      # revocation, another primary key or a signing subkey within 60 days of expiry becomes an
      # issue (the `key` job). It only reads the pinned key. A download or parse failure warns
      # and never stops release detection, which drives security bumps.
      - name: Compare Mozilla's release key with the pinned key
        id: key
        run: |
          url=https://archive.mozilla.org/pub/firefox/nightly/latest-mozilla-central/KEY
          if curl -fsSL --retry 3 --max-time 60 "$url" -o "$RUNNER_TEMP/mozilla-KEY"; then
            python3 tools/upstream/mozilla-key-check.py --current "$RUNNER_TEMP/mozilla-KEY" \
              --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY" ||
              echo "::warning::Could not check Mozilla's release key (mozilla-key-check.py)"
          else
            echo "::warning::Could not download Mozilla's release key from $url"
          fi

      # The runner's own Node: no setup-node, no npm ci (Node built-ins only).
      - name: Detect a newer Firefox release, classify it, measure drift
        id: detect
        run: |
          node tools/upstream/detect.mjs --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: What is already done for this release
        id: state
        if: steps.detect.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.detect.outputs.version }}
          SECURITY: ${{ steps.detect.outputs.security }}
          REBUILD: ${{ inputs.rebuild || false }}
        run: |
          branch="upstream/firefox-$VERSION"
          if [ "$REBUILD" = true ] ||
            ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --silent 2>/dev/null; then
            rebase=true
          else
            rebase=false
          fi
          title="Firefox $VERSION released"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label upstream \
            --search "\"$title\" in:title" --json number,title,labels \
            --jq "[.[] | select(.title == \"$title\")][0]")
          number=$(jq -r '.number // empty' <<< "${issue:-null}")
          has_security=$(jq -r '[.labels[]?.name] | index("security") != null' <<< "${issue:-null}")
          # A new issue, or one that needs the security label now that an advisory exists.
          if [ -z "$number" ] || { [ "$SECURITY" != false ] && [ "$has_security" != true ]; }; then
            track=true
          else
            track=false
          fi
          {
            echo "rebase=$rebase"
            echo "issue=$number"
            echo "track=$track"
          } >> "$GITHUB_OUTPUT"
          echo "Branch $branch: rebase=$rebase; tracking issue: ${number:-none} (track=$track)" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # The Beta canary's issues for this major, open or closed: the canary closes them once the
      # release is out, possibly before this run, and a closed one still says what was found
      # (spec upstream-beta-canary, decision 11). The bump PR only names them, so a failed
      # lookup leaves the list empty instead of stopping a security bump.
      - name: The Beta canary's issues for this release
        id: beta
        if: steps.detect.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          major=${VERSION%%.*}
          title="Firefox $major beta: canary findings"
          if [[ $major =~ ^[0-9]+$ ]] &&
            list=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --label upstream-beta \
              --limit 20 --search "\"$title\" in:title" --json number,state,title) &&
            found=$(jq -c --arg t "$title" '[.[] | select(.title == $t) | {number, state}]' <<< "$list"); then
            :
          else
            echo "::warning::Could not list the Beta canary's issues for Firefox $major"
            found='[]'
          fi
          echo "beta-issues=$found" >> "$GITHUB_OUTPUT"
          echo "Beta canary issues for Firefox $major: $found" >> "$GITHUB_STEP_SUMMARY"

  key:
    needs: detect
    if: needs.detect.outputs.key-title != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Runs gh alone: no checkout, so nothing from the repository runs with this token.
    permissions:
      issues: write # the "Mozilla's release key changed" issue
    steps:
      - name: Open or update the key issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ needs.detect.outputs.key-title }}
          REPORT: ${{ needs.detect.outputs.key-report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: JRanne # tools/repo.mjs MAINTAINER: an organization cannot be @-mentioned
        run: |
          printf '@%s %s\n\nDetected by [upstream.yml](%s).\n' "$OWNER" "$REPORT" "$RUN_URL" > key.md
          gh label create security --color B60205 --description "Security: act within days" --force
          open=$(gh issue list --state open --label security --search "\"$TITLE\" in:title" \
            --json number,title --jq "[.[] | select(.title == env.TITLE)][0].number // empty")
          # One open issue per title, kept current: detect runs every 4 hours.
          if [ -n "$open" ]; then
            gh issue edit "$open" --body-file key.md
          else
            gh issue create --title "$TITLE" --label security --body-file key.md
          fi
          echo "::warning::$TITLE (docs/runbook.md, \"Mozilla's release key\")"

  track:
    needs: detect
    if: needs.detect.outputs.track == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # create or label the tracking issue
    outputs:
      issue: ${{ steps.issue.outputs.issue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/upstream

      - name: Open or label the tracking issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          DETECTION: ${{ needs.detect.outputs.detection }}
          LABELS: ${{ needs.detect.outputs.labels }}
          SECURITY: ${{ needs.detect.outputs.security }}
          ISSUE: ${{ needs.detect.outputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: JRanne # tools/repo.mjs MAINTAINER: an organization cannot be @-mentioned
        run: |
          printf '%s' "$DETECTION" > detection.json
          gh label create upstream --color 1D76DB --description "Firefox upstream release" --force
          gh label create security --color B60205 --description "Security: act within days" --force
          node tools/upstream/autopilot-body.mjs issue --detection detection.json \
            --run-url "$RUN_URL" --owner "$OWNER" > issue.md
          if [ -z "$ISSUE" ]; then
            title=$(node tools/upstream/autopilot-body.mjs issue-title --detection detection.json)
            url=$(gh issue create --title "$title" --label "$LABELS" --body-file issue.md)
            ISSUE=${url##*/}
          else
            # An advisory appeared after the issue was opened (or the advisories page could not be
            # read, which counts as security until it can): label it and tell the owner.
            gh issue edit "$ISSUE" --add-label "$LABELS" --body-file issue.md
            if [ "$SECURITY" = true ]; then
              why="Mozilla now lists an advisory for this release"
            else
              why="The advisories page could not be read, so this release counts as one"
            fi
            gh issue comment "$ISSUE" --body "@$OWNER $why: labelled \`security\` ([run]($RUN_URL))."
          fi
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"

  patch-check:
    needs: detect
    if: needs.detect.outputs.rebase == 'true'
    runs-on: ubuntu-latest
    # Streams the ~810 MB source tarball through patch-check (~1–2 min).
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      result: ${{ steps.check.outputs.result }}
      artifacts: ${{ steps.check.outputs.artifacts }}
      artifacts-note: ${{ steps.check.outputs.artifacts-note }}
      prefs: ${{ steps.check.outputs.prefs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the new release's source (SHA-512, patches, audit, artifact preflight)
        id: check
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        # Shared with the Beta canary (spec upstream-beta-canary); fails unless Mozilla's signed
        # SHA512SUMS lists the tarball's SHA-512 (B1).
        run: tools/upstream/source-check.sh "$VERSION"

      # Only once source-check.sh wrote a result, which it does after the signature and hash are
      # verified: no report on an unverified tarball is ever published (G4).
      - name: Upload the patch-check report
        if: always() && steps.check.outputs.result != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patch-check
          path: |
            patch-check.*
            patch-audit.txt
            prefs-refresh.*
            reexport/
          if-no-files-found: ignore
          retention-days: 30

  test:
    needs: [detect, patch-check]
    if: needs.patch-check.outputs.result == 'ok' && needs.patch-check.outputs.artifacts == 'yes'
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml
    with:
      firefox-version: ${{ needs.detect.outputs.version }}
      prefs-patch-artifact: patch-check

  publish:
    needs: [detect, track, patch-check, test]
    # Also after failed tests (a draft PR says so); never without a finished patch check.
    if: >-
      always() && needs.detect.outputs.rebase == 'true' &&
      needs.patch-check.result == 'success' && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push upstream/firefox-X.Y.Z
      pull-requests: write # open the PR, close superseded ones
      issues: write # labels, the fallback comment, superseded tracking issues
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN || github.token }}
      VERSION: ${{ needs.detect.outputs.version }}
      LABELS: ${{ needs.detect.outputs.labels }}
      ISSUE: ${{ needs.track.outputs.issue || needs.detect.outputs.issue }}
      BETA_ISSUES: ${{ needs.detect.outputs.beta-issues }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.UPSTREAM_PR_TOKEN || github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: patch-check
          path: ${{ runner.temp }}/patch-check

      - name: Push the bump branch
        run: |
          branch="upstream/firefox-$VERSION"
          old=$(python3 tools/upstream/bump-surfer-json.py "$VERSION" | cut -d' ' -f1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          # The pref refresh the suites ran with (spec upstream-bump-automation, decision 4).
          pc="$RUNNER_TEMP/patch-check"
          prefs=()
          if [ -s "$pc/prefs-refresh.patch" ]; then
            git apply --include=src/browser/branding/vimma/pref/firefox-branding.js \
              "$pc/prefs-refresh.patch"
            prefs=(-m "Refresh the copied upstream prefs: $(jq -r '[.refreshed[].pref] | join(", ")' \
              "$pc/prefs-refresh.json").")
          fi
          git commit -am "upstream: firefox $VERSION" \
            -m "Bump surfer.json from Firefox $old to $VERSION. Opened by the upstream autopilot" \
            -m "(upstream.yml, ADR-015): patches checked, suites run, see the PR." "${prefs[@]}"
          # Fuzz-only patches re-exported from the verified tarball (spec upstream-bump-automation,
          # decision 14), as a second commit. Only src/**/*.patch paths are copied in.
          rx="$pc/reexport"
          if [ "$(jq -r .state "$rx/reexport.json" 2>/dev/null)" = reexported ]; then
            jq -r '.reexported[]' "$rx/reexport.json" | while read -r p; do
              [[ $p =~ ^src/[A-Za-z0-9._/-]+\.patch$ && $p != *..* && -f $p ]] || {
                echo "::error::refusing re-exported path '$p'"
                exit 1
              }
              cp "$rx/$p" "$p"
            done
            names=$(jq -r '[.reexported[] | sub(".*/"; "")] | join(", ")' "$rx/reexport.json")
            git commit -m "upstream: re-export $names for firefox $VERSION" \
              -m "These patches applied only with fuzz; re-exported against Firefox $VERSION with" \
              -m "the same added and removed lines (tools/upstream/reexport.py)." -- src
          fi
          # A rebuild replaces the branch: auto-merge decided for the old head goes first (spec
          # upstream-bump-automation, decision 13), and is decided again for the new one.
          gh pr list --head "$branch" --state open --json number,autoMergeRequest \
            --jq '.[] | select(.autoMergeRequest != null) | .number' |
            while read -r n; do gh pr merge "$n" --disable-auto; done
          # Only this job writes upstream/*.
          git push --force origin "HEAD:refs/heads/$branch"

      - name: Open the PR, or comment a compare link when Actions may not
        id: pr
        env:
          DETECTION: ${{ needs.detect.outputs.detection }}
          PATCH_RESULT: ${{ needs.patch-check.outputs.result }}
          ARTIFACTS: ${{ needs.patch-check.outputs.artifacts || 'unknown' }}
          ARTIFACTS_NOTE: ${{ needs.patch-check.outputs.artifacts-note }}
          TESTS: ${{ needs.test.result }}
          HAS_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN != '' }}
          AUTO_MERGE: ${{ vars.AUTO_MERGE_UPSTREAM }}
        run: |
          branch="upstream/firefox-$VERSION"
          pc="$RUNNER_TEMP/patch-check"
          printf '%s' "$DETECTION" > "$RUNNER_TEMP/detection.json"
          # The auto-merge allowlist reads the branch as pushed (decision 8), at merge-base with
          # main, so a later push by someone else is never what was checked.
          # Any failure here leaves no verdict, which keeps auto-merge off, never the PR closed.
          head=$(git rev-parse HEAD)
          if git fetch --no-tags --depth=50 origin main &&
            base=$(git merge-base origin/main "$head") &&
            git diff --unified=0 "origin/main...$head" > "$RUNNER_TEMP/bump.diff" &&
            git show "$base:surfer.json" > "$RUNNER_TEMP/base-surfer.json" &&
            git show "$head:surfer.json" > "$RUNNER_TEMP/head-surfer.json" &&
            node tools/upstream/bump-diff.mjs --diff "$RUNNER_TEMP/bump.diff" \
              --base-surfer "$RUNNER_TEMP/base-surfer.json" \
              --head-surfer "$RUNNER_TEMP/head-surfer.json" > "$RUNNER_TEMP/bump-diff.json"; then
            :
          else
            echo "::warning::the bump diff could not be checked; auto-merge stays off"
            rm -f "$RUNNER_TEMP/bump-diff.json"
          fi
          body() {
            node tools/upstream/autopilot-body.mjs "$@" --detection "$RUNNER_TEMP/detection.json" \
              --patch-check "$pc/patch-check.json" --patch-markdown "$pc/patch-check.md" \
              --audit "$pc/patch-audit.txt" --patch-result "$PATCH_RESULT" \
              --artifacts "$ARTIFACTS" --artifacts-note "$ARTIFACTS_NOTE" --tests "$TESTS" \
              --has-token "$HAS_TOKEN" --issue "$ISSUE" --branch "$branch" \
              --repo "$GITHUB_REPOSITORY" --run-url "$RUN_URL" --error "$RUNNER_TEMP/pr-error.txt" \
              --beta-issues "$BETA_ISSUES" --prefs "$pc/prefs-refresh.json" \
              --reexport "$pc/reexport/reexport.json" --auto-merge "$AUTO_MERGE" \
              --ref "$GITHUB_REF" --bump-diff "$RUNNER_TEMP/bump-diff.json"
          }
          body pr > "$RUNNER_TEMP/pr.md"
          title=$(body title)
          draft=()
          [ "$(body pr --draft-only)" = true ] && draft=(--draft)
          gh label create upstream --color 1D76DB --description "Firefox upstream release" --force
          gh label create security --color B60205 --description "Security: act within days" --force

          existing=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            # The title too: an advisory published after the PR opened joins its subject.
            gh pr edit "$existing" --title "$title" --body-file "$RUNNER_TEMP/pr.md" \
              --add-label "$LABELS"
            pr="#$existing"
          elif url=$(gh pr create "${draft[@]}" --base main --head "$branch" --label "$LABELS" \
              --title "$title" --body-file "$RUNNER_TEMP/pr.md" 2> "$RUNNER_TEMP/pr-error.txt"); then
            pr="#${url##*/}"
          elif grep -qi "not permitted to create or approve pull requests" "$RUNNER_TEMP/pr-error.txt"; then
            # The repository setting is off (docs/runbook.md): the branch is pushed; hand over.
            cat "$RUNNER_TEMP/pr-error.txt"
            echo "::warning::Actions may not open PRs here; commented a compare link on #$ISSUE"
            body fallback > "$RUNNER_TEMP/fallback.md"
            if [ -n "$ISSUE" ]; then
              gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/fallback.md"
            else
              gh issue create --title "$title: open the PR" --label "$LABELS" \
                --body-file "$RUNNER_TEMP/fallback.md"
            fi
            cat "$RUNNER_TEMP/fallback.md" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          else
            cat "$RUNNER_TEMP/pr-error.txt"
            exit 1
          fi
          echo "Opened or updated $pr for $branch" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "number=${pr#\#}"
            echo "head=$head"
            echo "title=$title"
            echo "auto-merge=$(body pr --auto-merge-only)"
          } >> "$GITHUB_OUTPUT"
          [ -n "$ISSUE" ] && gh issue comment "$ISSUE" --body "The autopilot opened $pr ([run]($RUN_URL))."

          # A newer release supersedes the bump PRs and tracking issues of older ones.
          gh pr list --state open --label upstream --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"upstream/firefox-\")) | select(.headRefName != \"$branch\") | .number" |
            while read -r n; do
              gh pr close "$n" --delete-branch --comment "Superseded by $pr (Firefox $VERSION)."
            done
          gh issue list --state open --label upstream --json number,title \
            --jq ".[] | select(.title | test(\"^Firefox [0-9.]+ released$\")) | select(.number != ${ISSUE:-0}) | .number" |
            while read -r n; do
              gh issue close "$n" --comment "Superseded by Firefox $VERSION ($pr)."
            done

      # Spec upstream-bump-automation, Behaviour 5 (docs/security.md, G13): GitHub's auto-merge, so
      # the main ruleset's required checks decide the merge. Only UPSTREAM_PR_TOKEN: a merge made
      # with GITHUB_TOKEN would start no push workflow on main (decision 7).
      - name: Set the bump PR to auto-merge when allowed
        id: automerge
        if: steps.pr.outputs.number != '' && steps.pr.outputs.auto-merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
          HEAD: ${{ steps.pr.outputs.head }}
          TITLE: ${{ steps.pr.outputs.title }}
        run: |
          number="$NUMBER"
          head="$HEAD"
          # A draft marks a bump that needs a person (decision 11); the head must be the commit
          # the allowlist checked (decision 9).
          state=$(gh pr view "$number" --json isDraft,headRefOid --jq '"\(.isDraft) \(.headRefOid)"')
          read -r draft pr_head <<< "$state"
          if [ "$draft" = false ] && [ "$pr_head" = "$head" ]; then
            gh pr merge "$number" --auto --squash --match-head-commit "$head" \
              --subject "$TITLE (#$number)" --body "$(git log -1 --format=%b "$head")"
            echo "Auto-merge on for #$number at $head" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::#$number not set to auto-merge: draft=$draft, head $pr_head != $head"
          fi

  drift:
    needs: detect
    if: needs.detect.outputs.drift == 'overdue'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # the drift issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/upstream

      - name: Open the drift issue (once) and fail
        env:
          GH_TOKEN: ${{ github.token }}
          DETECTION: ${{ needs.detect.outputs.detection }}
          DRIFT_LINE: ${{ needs.detect.outputs.drift-line }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: JRanne # tools/repo.mjs MAINTAINER: an organization cannot be @-mentioned
        run: |
          printf '%s' "$DETECTION" > detection.json
          title=$(node tools/upstream/autopilot-body.mjs drift-title --detection detection.json)
          gh label create security --color B60205 --description "Security: act within days" --force
          open=$(gh issue list --state open --label security --search "\"$title\" in:title" \
            --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -z "$open" ]; then
            node tools/upstream/autopilot-body.mjs drift --detection detection.json \
              --run-url "$RUN_URL" --owner "$OWNER" > drift.md
            gh issue create --title "$title" --label security --body-file drift.md
          fi
          echo "::error::$DRIFT_LINE (docs/security.md, G2)"
          exit 1
