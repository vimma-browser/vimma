# Spec site-compat (docs/specs/site-compat.md): the live site-compatibility suite. Each site of
# tools/sites/sites.json is loaded once in an artifact build under Xvfb, driven with vimma-ctl and
# read over the DevTools protocol; the report goes to the job summary and an artifact.
#
# A report, never a gate: it runs on a schedule and by hand only, never on pull requests, and is
# not a required check. Live sites change and bot checks come and go, so its results must not
# block anyone. A standard hosted runner (free on a public repo; larger runners are not, see the
# spec's "Cost and runtime") and no secret. The steps up to the artifact build are e2e.yml's
# (ADR-010), copied, with the same tarball checksum check.
#
# Each run is compared with the previous scheduled run, and regressions go to one issue labelled
# `site-compat` (decision 12). Three jobs: `sites` runs the browser on live pages and can only
# read the repository; `compare`, on a fresh runner, reads that run's results.json and the
# previous run's artifact and writes the diff and the issue text, with read permissions only;
# `report` checks out nothing and runs only gh on that issue text. Page text reaches it only as
# inert code spans (tools/sites/diff.mjs; docs/security.md, "Site compatibility workflow").
name: sites

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      filter:
        description: Sites whose id or name contains this (comma-separated terms); empty for all
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: sites
  cancel-in-progress: false

jobs:
  sites:
    name: site compatibility (live)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Build vimma-ctl (tools/vimma-ctl/rust-toolchain.toml)
        working-directory: tools/vimma-ctl
        run: rustup toolchain install && cargo build --locked

      - name: Disk guard (download and unpack need ~6 GB)
        run: |
          df -h . | tail -1
          free=$(df --output=avail -BG . | tail -1 | tr -dc 0-9)
          if [ "$free" -lt 8 ]; then
            echo "::error::Only ${free} GB free; the Firefox source needs ~6 GB (ADR-010)."
            exit 1
          fi

      # Verified against Mozilla's SHA512SUMS and unpacked into a fresh engine/ (as e2e.yml).
      - name: Firefox source tarball (surfer.json), verified and unpacked without history
        run: |
          tools/upstream/firefox-source.sh
          rm -f .surfer/engine/firefox-*.source.tar.xz

      - name: Import our patches and sources
        run: npm run import

      - name: Artifact build (tools/artifact-build)
        run: node tools/artifact-build/artifact-build.mjs

      # Exits 0 whenever it wrote a report, whatever the sites did; 1 only when the harness
      # itself failed. It appends the Markdown report to the job summary. Blocked sites get one
      # more visit at the end (decision 11): a datacenter IP's bot checks are often brief. Page
      # text reaches the log, so workflow commands (::error:: and the like) are off meanwhile.
      - name: Site compatibility (npm run sites -- --artifact --retry-blocked)
        env:
          FILTER: ${{ inputs.filter }}
        run: |
          token=$(openssl rand -hex 16)
          echo "::stop-commands::${token}"
          status=0
          npm run sites -- --artifact --retry-blocked ${FILTER:+--filter "$FILTER"} || status=$?
          echo "::${token}::"
          exit "$status"

      - name: Upload the report (results.json, report.md, report.html, screenshots/)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-compat
          path: site-compat-output/
          if-no-files-found: warn
          retention-days: 14

  compare:
    name: Night-to-night diff
    needs: sites
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # download this run's and the previous scheduled run's artifacts
      issues: read # find the open site-compat issue
    outputs:
      issue-action: ${{ steps.compare.outputs.action }}
      issue: ${{ steps.compare.outputs.issue }}
      diff-artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Only results.json is taken from the browser job's runner; compare.mjs checks its shape.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-compat
          path: report

      # The baseline: the latest successful scheduled run on main (this run is still in
      # progress, so it is never its own). None when it has expired; the diff then says so.
      - name: This run's results, the previous scheduled run's, and the open issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p current baseline previous
          cp report/results.json current/
          id=$(gh run list --workflow sites.yml --event schedule --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          # results.json from its report, diff.json (the tracking state) from its diff; either
          # may be missing on its own, which compare.mjs reports.
          if [ -n "$id" ]; then
            for pair in site-compat:results.json site-compat-diff:diff.json; do
              name=${pair%%:*} file=${pair#*:}
              if gh run download "$id" --name "$name" --dir "previous/$name" \
                && [ -f "previous/$name/$file" ]; then
                cp "previous/$name/$file" baseline/
              else
                echo "::warning::no $file in run $id's $name artifact"
              fi
            done
          fi
          issue=$(gh issue list --label site-compat --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          echo "OPEN_ISSUE=$issue" >> "$GITHUB_ENV"

      - name: Night-to-night diff (tools/sites/compare.mjs)
        id: compare
        env:
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node tools/sites/compare.mjs --cur current/results.json --out site-compat-diff \
            --prev baseline --open-issue "$OPEN_ISSUE" \
            --run-url "$RUN_URL" $([ "$SCHEDULED" = true ] && echo --scheduled)

      # diff.json is the next night's tracking state: kept as long as the report artifact.
      - name: Upload the diff (diff.md, diff.json, issue.md)
        id: upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-compat-diff
          path: site-compat-diff/
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Update the site-compat issue
    needs: compare
    # By the compare job's own upload id, and only when that job succeeded: an artifact of the
    # same name uploaded from elsewhere in the run is never the one posted.
    if: ${{ !cancelled() && needs.compare.result == 'success' && needs.compare.outputs.issue-action != '' && needs.compare.outputs.issue-action != 'none' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # open, update or close the one site-compat issue, and its label
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.compare.outputs.diff-artifact }}
          path: out

      - name: Issue
        env:
          ACTION: ${{ needs.compare.outputs.issue-action }}
          ISSUE: ${{ needs.compare.outputs.issue }}
        run: |
          gh label create site-compat --force --color FBCA04 \
            --description "A site-compatibility check regressed (sites.yml)"
          case "$ACTION" in
            create)
              gh issue create --title "Site compatibility regressions" --label site-compat \
                --body-file out/issue.md
              ;;
            update | close)
              if ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then
                echo "::error::not an issue number: $ISSUE"
                exit 1
              fi
              if [ "$ACTION" = update ]; then
                gh issue edit "$ISSUE" --body-file out/issue.md
              else
                gh issue comment "$ISSUE" --body-file out/issue.md
                gh issue close "$ISSUE" --reason completed
              fi
              ;;
            *)
              echo "::error::unknown action: $ACTION"
              exit 1
              ;;
          esac
