# Spec m0-pipeline. The required check "lint, typecheck, test, commitlint, licences" is one job;
# a guard job before it skips a push to main whose tree a pull request already passed (#358).
# vimma-ctl's clippy and tests also run on macOS in a job of their own, which is not a required
# check (spec macos-build, sub-PR 2).
# Issue #245: on a docs-only pull request (tools/ci/docs-only.mjs) the steps that Markdown cannot
# affect skip with `if:`, and the job still reports. The steps that read Markdown (prettier,
# md-wording, spec-lint, changelog-lint, security-links, gen-docs, test:py, the Vitest files in
# MARKDOWN_TESTS) and commitlint always run.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: PRs opened by bot workflows with GITHUB_TOKEN do not trigger
    # workflows; marking them ready (or a manual run below) starts CI as the owner.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Issue #358: did a pull request already pass this workflow on the tree just pushed? A squash
  # merge usually gives main the pull request head's tree, so tools/ci/tree-covered.mjs looks for
  # a successful pull_request run of this workflow with that tree and, on a match, skips the
  # checks below with a notice naming it. When main moved after that run the trees differ and the
  # checks run: the ruleset does not require up-to-date branches, so this is the only check of the
  # merged combination. Other events skip this job, and a guard that fails before its verdict
  # leaves the output empty: both run everything (!cancelled() below, not success()). A commitlint
  # failure after a cover fails this job alone; the covered checks stay skipped.
  covered:
    name: tree already checked on a pull request?
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # this workflow's runs
      contents: read # a commit's tree
    outputs:
      skip: ${{ steps.tree.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the pushed range, for commitlint below
          persist-credentials: false

      # The workflow file comes from GITHUB_WORKFLOW_REF, which the runner sets, so no workflow
      # can name another here and skip on its passes.
      - name: Same tree as a successful pull_request run? (tools/ci/tree-covered.mjs)
        id: tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/tree-covered.mjs

      # The squash commit's message is new on main (release-please builds the changelog from it,
      # docs/runbook.md "Releases"), so lint it here when the check job below does not run.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.tree.outputs.skip == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci
        if: steps.tree.outputs.skip == 'true'
        run: npm ci

      - name: commitlint (pushed range)
        if: steps.tree.outputs.skip == 'true'
        env:
          FROM: ${{ github.event.before }}
          TO: ${{ github.sha }}
        run: |
          if [ "$FROM" = "0000000000000000000000000000000000000000" ]; then
            npx --no -- commitlint --last --verbose
          else
            npx --no -- commitlint --from "$FROM" --to "$TO" --verbose
          fi

  check:
    name: lint, typecheck, test, commitlint, licences
    needs: covered
    if: ${{ !cancelled() && needs.covered.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commitlint and the classifier read the whole PR range

      # The classifier as the base branch has it, so the pull request cannot change the answer;
      # without one on the base the output stays empty and everything runs.
      - name: Docs-only pull request? (tools/ci/docs-only.mjs, from the base)
        id: classify
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git show "$BASE:tools/ci/docs-only.mjs" > "$RUNNER_TEMP/docs-only.mjs"; then
            node "$RUNNER_TEMP/docs-only.mjs" --event pull_request --base "$BASE" --head "$HEAD"
          else
            echo "No classifier on the base: running everything"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc # exact Node pin (docs/runbook.md, "Bench baseline")
          cache: npm

      - name: npm ci
        run: npm ci

      - name: eslint
        if: steps.classify.outputs.docs-only != 'true'
        run: npx --no -- eslint .

      - name: prettier --check (Markdown too)
        run: npx --no -- prettier --check .

      # Markdown is documentation for outside readers: no record of who asked or when (#226).
      - name: No process wording in Markdown (npm run md-wording)
        run: npm run md-wording

      # Code comments say why, not who asked or which review found it (#275).
      - name: No process wording in code comments (npm run comment-wording)
        if: steps.classify.outputs.docs-only != 'true'
        run: npm run comment-wording

      # Spec and ADR statuses, a live spec's issue line, and a reason for every new decision
      # (docs/specs/README.md).
      - name: Spec statuses and decision reasons (npm run spec-lint)
        run: npm run spec-lint

      # CHANGELOG.md's [Unreleased] is its first heading, appears once and holds only what the
      # release PR's firefox-notes job can move into the new version's entry (issue #529).
      - name: Hand-written changelog lines in order (npm run changelog-lint)
        run: npm run changelog-lint

      # docs/bindings.md, docs/bindings.json and defaults.toml are generated: a hand edit fails here.
      - name: Generated docs are current (npm run gen-docs)
        run: |
          npm run gen-docs
          if ! git diff --exit-code -- docs/bindings.md docs/bindings.json \
            packages/vimma-core/defaults.toml; then
            echo "::error::Generated docs differ from npm run gen-docs: edit actions.mjs or defaults.mjs and run it, never the output"
            exit 1
          fi

      - name: Typecheck
        if: steps.classify.outputs.docs-only != 'true'
        run: npm run typecheck

      - name: Vitest with coverage gate (vitest.config.mjs)
        if: steps.classify.outputs.docs-only != 'true'
        run: npm run coverage

      # Plan §5 performance gate (issue #17): fails on a case over 50 µs, or the suite more than
      # 10 % slower (one case 25 %) than the baseline recorded for this runner's CPU model. A step,
      # not a job (~30 s; no extra per-job minute). Why it does not flake: docs/runbook.md,
      # "Bench baseline".
      # Docs-only: instead of the whole suite, the Vitest files that read the repo's Markdown.
      - name: Vitest, the files that read Markdown (docs-only pull request)
        if: steps.classify.outputs.docs-only == 'true'
        run: npx --no -- vitest run $(node tools/ci/docs-only.mjs --markdown-tests)

      - name: Key-to-action bench against the baseline
        if: steps.classify.outputs.docs-only != 'true'
        run: npm run bench -- --check

      - name: Python tests (tools/upstream)
        run: npm run test:py

      # docs/security.md names the test behind each rule; a renamed or deleted test fails here.
      - name: Security model test links (docs/security.md)
        run: npm run security-links

      - name: Licences of package-lock.json
        if: steps.classify.outputs.docs-only != 'true'
        run: npm run license-check

      # vimma-ctl (ADR-011). On Linux, steps of the required check: see the note at the top.
      # The runner image ships rustup; it installs the toolchain pinned in rust-toolchain.toml.
      - name: Rust toolchain (tools/vimma-ctl/rust-toolchain.toml)
        if: steps.classify.outputs.docs-only != 'true'
        working-directory: tools/vimma-ctl
        run: rustup toolchain install && cargo --version && cargo clippy --version

      - name: cargo fmt
        if: steps.classify.outputs.docs-only != 'true'
        working-directory: tools/vimma-ctl
        run: cargo fmt --check

      - name: cargo clippy
        if: steps.classify.outputs.docs-only != 'true'
        working-directory: tools/vimma-ctl
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        if: steps.classify.outputs.docs-only != 'true'
        working-directory: tools/vimma-ctl
        run: cargo test --locked

      - name: Licences of the Rust crates
        if: steps.classify.outputs.docs-only != 'true'
        run: npm run license-check:crates

      - name: MPL headers in src/
        if: steps.classify.outputs.docs-only != 'true'
        run: npx --no -- surfer license-check

      - name: commitlint (PR range)
        if: github.event_name == 'pull_request'
        env:
          FROM: ${{ github.event.pull_request.base.sha }}
          TO: ${{ github.event.pull_request.head.sha }}
        run: npx --no -- commitlint --from "$FROM" --to "$TO" --verbose

      - name: commitlint (manual run, branch vs main)
        if: github.event_name == 'workflow_dispatch'
        run: npx --no -- commitlint --from origin/main --to HEAD --verbose

      - name: commitlint (pushed range)
        if: github.event_name == 'push'
        env:
          FROM: ${{ github.event.before }}
          TO: ${{ github.sha }}
        run: |
          if [ "$FROM" = "0000000000000000000000000000000000000000" ]; then
            npx --no -- commitlint --last --verbose
          else
            npx --no -- commitlint --from "$FROM" --to "$TO" --verbose
          fi

  # vimma-ctl on macOS (spec macos-build, sub-PR 2): its profile root and its stale-pid check
  # differ there. clippy and the tests only; fmt and the licence check are the same on any host.
  vimma-ctl-macos:
    name: vimma-ctl on macOS
    needs: covered
    if: ${{ !cancelled() && needs.covered.outputs.skip != 'true' }}
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the classifier reads the PR range
          persist-credentials: false

      # As in the check job: the classifier from the base, so the pull request cannot change it.
      # The runner image's Node runs it; it uses Node's built-in modules only.
      - name: Docs-only pull request? (tools/ci/docs-only.mjs, from the base)
        id: classify
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git show "$BASE:tools/ci/docs-only.mjs" > "$RUNNER_TEMP/docs-only.mjs"; then
            node "$RUNNER_TEMP/docs-only.mjs" --event pull_request --base "$BASE" --head "$HEAD"
          else
            echo "No classifier on the base: running everything"
          fi

      # The runner image ships rustup; it installs the toolchain pinned in rust-toolchain.toml.
      - name: Rust toolchain (tools/vimma-ctl/rust-toolchain.toml)
        if: steps.classify.outputs.docs-only != 'true'
        working-directory: tools/vimma-ctl
        run: rustup toolchain install && cargo --version && cargo clippy --version

      - name: cargo clippy
        if: steps.classify.outputs.docs-only != 'true'
        working-directory: tools/vimma-ctl
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        if: steps.classify.outputs.docs-only != 'true'
        working-directory: tools/vimma-ctl
        run: cargo test --locked
