# Spec m6-packaging, "Arch Linux without the AUR": the vimma-bin PKGBUILD that release.yml
# publishes is built and installed with makepkg -si in an Arch Linux container, from a stub
# tarball served on localhost, whenever the packaging code changes. release.yml's package job
# runs the same script on the real release build. Spec macos-homebrew, decision 9: the Homebrew
# cask is checked the same way, with brew style, brew audit and an install of a stub dmg on a
# hosted Mac; release.yml's macos-smoke job runs the same script on the real dmg.
name: pkgbuild

on:
  pull_request:
    paths:
      - tools/package/**
      - tools/release/version-line.mjs
      - tools/version-files/version-files.mjs
      - tools/repo.mjs
      - surfer.json
      - .github/workflows/pkgbuild.yml
  push:
    branches: [main]
    paths:
      - tools/package/**
      - tools/release/version-line.mjs
      - tools/version-files/version-files.mjs
      - tools/repo.mjs
      - surfer.json
      - .github/workflows/pkgbuild.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkgbuild-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Issue #358: did a pull request already pass this workflow on the tree just pushed? A squash
  # merge usually gives main the pull request head's tree, so tools/ci/tree-covered.mjs looks for
  # a successful pull_request run of this workflow with that tree and, on a match, skips the
  # checks below with a notice naming it. When main moved after that run the trees differ and the
  # checks run: the ruleset does not require up-to-date branches, so this is the only check of the
  # merged combination. Other events skip this job, and a guard that fails before its verdict
  # leaves the output empty: both run everything (!cancelled() below, not success()).
  covered:
    name: tree already checked on a pull request?
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # this workflow's runs
      contents: read # a commit's tree
    outputs:
      skip: ${{ steps.tree.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci/tree-covered.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The workflow file comes from GITHUB_WORKFLOW_REF, which the runner sets, so no workflow
      # can name another here and skip on its passes.
      - name: Same tree as a successful pull_request run? (tools/ci/tree-covered.mjs)
        id: tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/tree-covered.mjs

  arch:
    name: PKGBUILD on Arch Linux (makepkg -si)
    needs: covered
    if: ${{ !cancelled() && needs.covered.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # package.mjs and version-line.mjs use Node's built-in modules only: no npm install.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Build and install the PKGBUILD from a stub tarball
        run: tools/package/arch-smoke.sh --stub

  cask:
    name: Homebrew cask on macOS (brew install --cask)
    needs: covered
    if: ${{ !cancelled() && needs.covered.outputs.skip != 'true' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cask.mjs uses Node's built-in modules only: no npm install.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Check the cask and install a stub dmg through it
        run: tools/package/cask-check.sh --stub
