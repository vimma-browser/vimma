# CodeQL code scanning. Gated off while the repo is private: uploading results to a private
# repo needs a paid GitHub Code Security licence, and the CodeQL CLI licence permits CI
# analysis only of an open source codebase (a private repo is named as not one). The job turns
# on by itself when the repo goes public. Until then, semgrep.yml covers static analysis.
name: CodeQL

on:
  # Not deduplicated like ci.yml and semgrep.yml (#358): code scanning keeps the alerts of main
  # from analyses uploaded for commits of main, and compares a pull request's analysis against
  # the latest one of its base. A push whose tree a pull request already analyzed still needs
  # its own upload, or main's alerts and that baseline would stop at the previous merge.
  push:
    branches: [main]
  # Every pull request, docs-only ones too (unlike e2e.yml, issue #245): the ruleset's code
  # scanning rule blocks a merge until CodeQL has results for the pull request, and skipped
  # analyses leave none (docs/runbook.md, "Docs-only pull requests").
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "41 5 * * 1" # Mondays 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript: packages/, src/.../vimma/, tools/, tests/; rust: tools/vimma-ctl.
        # No build: neither language needs one (no Firefox engine either).
        language: [javascript-typescript, rust]
    # Issue #443: a push to a draft pull request (opened, synchronize: a new head, so no earlier
    # analysis is replaced) skips every step, not the job, so both required checks
    # report under their matrix names (a matrix job skipped by its own `if:` reports one check
    # named with the unexpanded expression). No analysis is uploaded for a draft, so the code
    # scanning rule keeps it blocked until the run that marking it ready starts on the same head.
    steps:
      - name: Draft pull request (analysis skipped until it is marked ready)
        if: github.event.pull_request.draft == true && (github.event.action == 'opened' || github.event.action == 'synchronize')
        run: echo "::notice::A draft pull request gets no CodeQL analysis until it is marked ready for review"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !(github.event.pull_request.draft == true && (github.event.action == 'opened' || github.event.action == 'synchronize')) }}

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: ${{ !(github.event.pull_request.draft == true && (github.event.action == 'opened' || github.event.action == 'synchronize')) }}
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: ${{ !(github.event.pull_request.draft == true && (github.event.action == 'opened' || github.event.action == 'synchronize')) }}
        with:
          category: /language:${{ matrix.language }}
