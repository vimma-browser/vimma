# Spec m0-pipeline, plan §8 "Unattended runs". Follows anthropics/claude-code-action v1
# (docs/setup.md, docs/security.md, examples/claude.yml).
#
# Security model (see the spec's Settled section and docs/runbook.md):
# - Every job passes `github_token: github.token`, so the job's `permissions:` block is the
#   token Claude gets (without it the action uses the Claude app's installation token, which has
#   contents/pull-requests/issues write whatever this file says).
# - `mention`: `@claude` from the owner, a member or a collaborator. Read-only contents: it
#   answers, reviews and comments, but cannot push.
# - `spec`: only when the repository owner adds `claude:go` to a `spec` issue. Claude edits and
#   commits with a read-only token and a short tool allowlist; the commits leave as a patch.
# - `spec-pr`: no Claude. Applies the patch, pushes `claude/spec-*` and opens a draft PR (`bot`).
#   GITHUB_TOKEN cannot push workflow changes, and PRs it opens do not trigger CI: mark the PR
#   ready for review (or `gh workflow run ci.yml --ref <branch>`) to run CI.
# Needs ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN; without one every step after the check
# skips and the run is green.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]

permissions:
  contents: read

jobs:
  mention:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && github.event.action != 'labeled' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # no pushes: code changes go through the spec flow
      pull-requests: write # comment and review on PRs
      issues: write # tracking comment on issues
      actions: read # read CI results on PRs
    env:
      HAS_CLAUDE_AUTH: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip without a Claude secret
        if: env.HAS_CLAUDE_AUTH != 'true'
        run: >-
          echo "::notice::claude.yml skipped: add ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN
          (docs/runbook.md)."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --max-turns 40

  spec:
    if: |
      github.event_name == 'issues' && github.event.action == 'labeled' &&
      github.event.label.name == 'claude:go' &&
      github.event.sender.login == 'JRanne' &&
      contains(github.event.issue.labels.*.name, 'spec')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: read
    env:
      HAS_CLAUDE_AUTH: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      ISSUE: ${{ github.event.issue.number }}
    outputs:
      ran: ${{ steps.patch.outputs.ran }}
    steps:
      - name: Skip without a Claude secret
        if: env.HAS_CLAUDE_AUTH != 'true'
        run: >-
          echo "::notice::claude.yml skipped: add ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN
          (docs/runbook.md)."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          node-version-file: .nvmrc # exact Node pin (docs/runbook.md, "Bench baseline")
          cache: npm

      - name: Install and branch
        if: env.HAS_CLAUDE_AUTH == 'true'
        run: |
          npm ci
          git switch -c "claude/spec-$ISSUE"

      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Implement the spec in issue #${{ github.event.issue.number }} of ${{ github.repository }}
            (read it with `gh issue view ${{ github.event.issue.number }}`). You are on a fresh
            branch from main. Follow CLAUDE.md exactly: read the spec under docs/specs/, write the
            failing tests first, then the code; `npm test`, `npm run typecheck` and `npm run lint`
            must pass. Commit with `git add` and `git commit`, Conventional Commits whose body is
            the changelog line. Do not push and do not open a PR: the workflow does both from
            your commits. Never edit .github/, lint config, screenshot baselines or surfer.json
            pins to get green.
          claude_args: >-
            --max-turns 100
            --permission-mode acceptEdits
            --allowedTools "Read,Glob,Grep,LS,Edit,MultiEdit,Write,Bash(npm test),Bash(npm run lint),Bash(npm run typecheck),Bash(npm run coverage),Bash(npm run format),Bash(npm run gen-docs),Bash(npm run test:py),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(gh issue view:*)"

      - name: Export commits as a patch
        id: patch
        if: env.HAS_CLAUDE_AUTH == 'true'
        run: |
          git format-patch --stdout origin/main..HEAD > spec.patch
          if [ ! -s spec.patch ]; then
            echo "::error::Claude made no commits for #$ISSUE."
            exit 1
          fi
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.patch.outputs.ran == 'true'
        with:
          name: spec-patch
          path: spec.patch
          retention-days: 7

  spec-pr:
    needs: spec
    if: needs.spec.outputs.ran == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push claude/spec-* (GITHUB_TOKEN cannot touch .github/workflows)
      pull-requests: write
      issues: write # create the `bot` label if missing
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spec-patch
          path: ${{ runner.temp }}/spec

      - name: Apply the patch, push the branch, open a draft PR
        run: |
          branch="claude/spec-$ISSUE"
          git config user.name "claude[bot]"
          git config user.email "41898282+claude[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git -c core.hooksPath=/dev/null am "$RUNNER_TEMP/spec/spec.patch"
          git push --force origin "$branch"
          gh label create bot --color 5319E7 --description "Opened by automation" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --draft --base main --head "$branch" --label bot \
              --title "$(git log -1 --format=%s origin/main..HEAD)" \
              --body "Closes #$ISSUE. Implemented by claude.yml from the spec issue.

          CI does not start on PRs opened by GITHUB_TOKEN: mark this ready for review (or
          \`gh workflow run ci.yml --ref $branch\`) to run it."
          fi
