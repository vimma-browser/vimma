# Spec m6-packaging: build, package and sign a release and upload its assets (the vimma-bin
# PKGBUILD among them) to its GitHub Release while that is still a draft. Publishing the draft
# is the maintainer's click and rebuilds nothing; aur.yml then pushes AUR vimma-bin.
# release-please creates the tag vX.Y.Z and the draft; this workflow adds the assets.
# Nothing runs until the repository variable RELEASE_ENABLED is `true`, manual runs included.
# Setup and verification: docs/runbook.md, "Releases".
#
# Trigger: workflow_dispatch only. A draft fires no `release` event, and a tag pushed with
# GITHUB_TOKEN starts no workflow, but GITHUB_TOKEN may dispatch one: release-please.yml's
# release-build job runs `workflow_dispatch` on main with the new tag, and a retry is the same
# call by hand: gh workflow run release.yml -f tag=vX.Y.Z. A hand-pushed v* tag starts nothing,
# and neither can a fork or a pull request. A manual run executes the release.yml of the branch
# it is started on, so every job requires main; that guard stops accidental runs, while the
# real control is the signature: it names release.yml at refs/heads/main, the one identity users
# verify, which no other branch's workflow can obtain (tools/package/test/release-workflow.test.mjs).
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload to (vX.Y.Z)"
        required: true
        type: string
      replace_published:
        description: "Also replace the assets of a release that is already published"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}

jobs:
  # Full build on the standard GitHub-hosted runner, never a self-hosted one (docs/security.md,
  # B5), from Firefox source firefox-source.sh verifies and extracts in this job, restoring nothing
  # from the Actions cache (spec build-supply-chain, B1 and B2). Read-only token, and one secret,
  # the Google Safe Browsing key, which ships inside the binaries anyway (spec
  # m0-safebrowsing-key): what it produces is checked, signed and uploaded by the jobs below. It
  # builds in a fresh objdir with an empty compiler cache of its own, so the rule holds on any
  # runner (docs/runbook.md, "Full builds").
  build:
    if: >-
      vars.RELEASE_ENABLED == 'true' && github.repository == 'vimma-browser/vimma' &&
      github.ref == 'refs/heads/main'
    # The Safe Browsing key is a secret of the `build` environment, which only main may deploy
    # from (docs/security.md, B6): GitHub enforces that outside this file.
    environment: build
    runs-on: ubuntu-24.04
    # About 1.5 times the measured job, 117 min (docs/runbook.md, "Full builds"), well under
    # GitHub's 6 hours, so a hung build fails here with its own log and failure handling.
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Check the tag's form
        run: |
          echo "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "::error::'$TAG' is not a vX.Y.Z release tag"; exit 1; }

      # The signature names release.yml at refs/heads/main whatever the tag points to, so only a
      # commit on main is built: a tag pushed on another branch's commit is refused. "ahead":
      # main has commits after the commit; "identical": it is main's head. The tag is resolved to
      # one commit here, and every job checks out that commit, never the tag by name, so moving
      # the tag during the build cannot change what is packaged and signed.
      - name: The tag is on main
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
          echo "$sha" | grep -Eqx '[0-9a-f]{40}' || { echo "::error::$TAG: no commit"; exit 1; }
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...refs/heads/main" --jq .status)
          case "$status" in
            ahead|identical) ;;
            *) echo "::error::$TAG ($sha) is not on main (compare: $status)"; exit 1 ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.sha }}
          persist-credentials: false

      # No `cache` input: a build restores nothing from the Actions cache (B2).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: Fresh objdir and compiler cache for this release
        run: |
          objdir="$GITHUB_WORKSPACE/engine/obj-release"
          cache="$RUNNER_TEMP/sccache-release"
          # A server left running by anything before this job would keep serving its own cache.
          "$HOME/.mozbuild/sccache/sccache" --stop-server || true
          rm -rf "$objdir" "$cache"
          mkdir -p "$cache"
          { echo "MOZ_OBJDIR=$objdir"; echo "SCCACHE_DIR=$cache"; } >> "$GITHUB_ENV"

      - name: The tag matches surfer.json's version
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { releaseVersion } from "./tools/package/package.mjs";
            const config = JSON.parse(readFileSync("surfer.json", "utf8"));
            console.log("Vimma " + releaseVersion(config, process.env.TAG));'

      # Before the download, so a runner image that shrank fails in seconds, not after an hour of
      # compiling. The build needs about 26 GB, the swap file 16 GB (runbook, "Full builds").
      - name: Disk guard (a full build and its swap file need about 42 GB)
        run: |
          df -h . | tail -1
          free=$(df --output=avail -BG . | tail -1 | tr -dc 0-9)
          if [ "$free" -lt 50 ]; then
            echo "::error::Only ${free} GB free; the build and its swap file need about 42 GB."
            exit 1
          fi

      # The Rust stage of the build peaks at 15.3 GB of the runner's 16 GB of memory plus 10.4 GB
      # of swap; without this file the first measured build was killed after 38 minutes
      # (docs/runbook.md, "Full builds").
      - name: Swap file (16 GB)
        run: |
          sudo fallocate -l 16G /vimma-swapfile
          sudo chmod 600 /vimma-swapfile
          sudo mkswap /vimma-swapfile > /dev/null
          sudo swapon /vimma-swapfile
          free -g

      # Verified against Mozilla's SHA512SUMS and extracted afresh in this job (B1, B2).
      - name: Firefox source (surfer.json), verified and freshly extracted
        run: tools/upstream/firefox-source.sh

      # As nightly.yml: the secret goes to a mode-600 file through a shell builtin, never echoed;
      # configs/common/mozconfig reads VIMMA_SAFEBROWSING_KEYFILE. It stays until the last mach
      # call (package): mach re-reads the mozconfig, which fails on a missing file.
      - name: Safe Browsing key file
        env:
          SAFEBROWSING_API_KEY: ${{ secrets.SAFEBROWSING_API_KEY }}
        run: |
          if [ -z "$SAFEBROWSING_API_KEY" ]; then
            echo "::error::secret SAFEBROWSING_API_KEY is not set; a release must have the key"
            exit 1
          fi
          keyfile="$RUNNER_TEMP/vimma-safebrowsing.key"
          (umask 077 && printf '%s' "$SAFEBROWSING_API_KEY" > "$keyfile")
          echo "VIMMA_SAFEBROWSING_KEYFILE=$keyfile" >> "$GITHUB_ENV"

      - name: Import patches and our sources
        run: npm run import

      # As nightly.yml: mach must not see engine/'s empty repository, or --enable-bootstrap finds
      # none of Mozilla's toolchains (its taskgraph hashes only the files a repository tracks).
      - name: Build
        run: |
          rm -rf engine/.git
          npx --no -- surfer build

      - name: Smoke check
        run: |
          # stdout alone: on ubuntu-24.04 AppArmor denies unprivileged user namespaces, and the
          # sandbox's probe writes "Sandbox: CanCreateUserNamespace() ... EPERM" to stderr, which
          # stays in the step log. A failing or crashing binary still fails here (bash -e).
          version=$("$MOZ_OBJDIR/dist/bin/vimma" --version)
          # "Vimma <vimma> · Firefox <firefox>" from surfer.json (spec firefox-versions), and the
          # tag must be its Vimma version.
          expected=$(node tools/release/version-line.mjs)
          case "$expected" in "Vimma ${TAG#v} · Firefox "*) ;; *) echo "::error::surfer.json gives '$expected', tag is $TAG"; exit 1 ;; esac
          [ "$version" = "$expected" ] || { echo "::error::--version is '$version', want '$expected'"; exit 1; }
          # appinfo.version is the Firefox version (spec m0-app-version); --version shows Vimma's.
          appver=$(sed -n 's/^Version=//p' "$MOZ_OBJDIR/dist/bin/application.ini")
          firefox=$(node -p 'require("./surfer.json").version.version')
          [ "$appver" = "$firefox" ] || { echo "::error::app version is '$appver', want '$firefox'"; exit 1; }
          # Safe Browsing needs the key compiled in; configure's placeholder means it is missing.
          # Fail closed: a moved or missing AppConstants must not pass as "keyed".
          appconstants="$MOZ_OBJDIR/dist/bin/modules/AppConstants.sys.mjs"
          [ -f "$appconstants" ] || { echo "::error::$appconstants not found"; exit 1; }
          grep -q 'MOZ_GOOGLE_SAFEBROWSING_API_KEY' "$appconstants" \
            || { echo "::error::no Safe Browsing key constant in AppConstants"; exit 1; }
          if grep -q '"no-google-safebrowsing-api-key"' "$appconstants"; then
            echo "::error::built without the Safe Browsing key"; exit 1
          fi

      - name: Package with mach (dist/vimma-<firefox>.en-US.linux-x86_64.tar.xz)
        run: |
          (cd engine && ./mach package)
          rm -rf release && mkdir release
          cp "$MOZ_OBJDIR"/dist/vimma-*.en-US.linux-x86_64.tar.xz release/

      - name: Delete the Safe Browsing key file
        if: always()
        run: rm -f "$RUNNER_TEMP/vimma-safebrowsing.key"

      - name: SBOM (CycloneDX), checked against the official 1.6 schema
        run: |
          node tools/package/sbom.mjs --engine engine --out "release/vimma-${TAG#v}.cdx.json"
          node tools/package/validate-sbom.mjs "release/vimma-${TAG#v}.cdx.json"

      - name: Stop the release compiler cache
        if: always()
        run: |
          "$HOME/.mozbuild/sccache/sccache" --stop-server || true
          rm -rf "$RUNNER_TEMP/sccache-release"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: release/
          retention-days: 7
          if-no-files-found: error

  # vimma-ctl (spec ship-vimma-ctl), from the commit build checked, after it so there is one
  # sha. No environment, so no secret is in reach, and a read-only token. The crate has no
  # dependencies (ADR-011): cargo reads the crates.io index for the lockfile but fetches no crate.
  # musl, statically linked, so the one binary runs on every distribution the packages support,
  # whatever their glibc; the AppImage, .deb, .rpm, PKGBUILD and tarball all carry it.
  ctl:
    needs: build
    if: >-
      vars.RELEASE_ENABLED == 'true' && github.repository == 'vimma-browser/vimma' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      # The runner image ships rustup; it installs the toolchain pinned in rust-toolchain.toml.
      - name: Build vimma-ctl (static, musl)
        working-directory: tools/vimma-ctl
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl

      # Its version is surfer.json's displayVersion (build.rs), which the build job checked
      # against the tag.
      - name: Check the binary
        run: |
          bin=tools/vimma-ctl/target/x86_64-unknown-linux-musl/release/vimma-ctl
          file "$bin"
          file "$bin" | grep -q 'static-pie linked' || { echo "::error::vimma-ctl is not static"; exit 1; }
          version=$("$bin" --version)
          [ "$version" = "vimma-ctl ${TAG#v} (protocol 2)" ] || { echo "::error::vimma-ctl --version is '$version'"; exit 1; }
          mkdir ctl
          cp "$bin" ctl/vimma-ctl

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The notices of what the toolchain linked into the binary (musl, Rust's standard library,
      # libunwind), and its SBOM entry, from the toolchain that built it (#516).
      - name: Notices and SBOM entry for vimma-ctl
        run: |
          node tools/package/ctl-notices.mjs --target x86_64-unknown-linux-musl --binary ctl/vimma-ctl \
            --out ctl/vimma-ctl-licenses --component ctl/vimma-ctl.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctl
          path: ctl/
          retention-days: 7
          if-no-files-found: error

  # AppImage, .deb, .rpm, PKGBUILD and SRCINFO, the AUR variant, SHA256SUMS, each with vimma-ctl;
  # then install and start what was built.
  package:
    needs: [build, ctl]
    if: >-
      vars.RELEASE_ENABLED == 'true' && github.repository == 'vimma-browser/vimma' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MAINTAINER: ${{ vars.PACKAGE_MAINTAINER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Not .nvmrc: this checks out a release tag, and tags from before .nvmrc lack it. Runs no
          # bench, so the major is enough.
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ctl
          path: ctl

      # For validate-sbom.mjs (ajv), which checks the SBOM once vimma-ctl is in it.
      - name: npm ci
        run: npm ci --ignore-scripts

      # rpmbuild comes from Ubuntu's archive, as dpkg-deb does from the image (spec rpm-package).
      - name: Tools (appimagetool and runtime pinned by SHA-256; desktop-file-validate; rpmbuild)
        run: |
          tools/package/fetch-appimagetool.sh "$RUNNER_TEMP/appimagetool"
          sudo apt-get update -q
          sudo apt-get install -y -q desktop-file-utils rpm

      - name: Package
        run: |
          [ -n "$MAINTAINER" ] || { echo "::error::set the PACKAGE_MAINTAINER variable ('Name <email>')"; exit 1; }
          v=${TAG#v}
          tarball=$(echo build/vimma-*.en-US.linux-x86_64.tar.xz)
          # download-artifact does not keep the mode
          chmod 755 ctl/vimma-ctl
          node tools/package/package.mjs --tarball "$tarball" --ctl ctl/vimma-ctl \
            --ctl-licenses ctl/vimma-ctl-licenses --out dist --tag "$TAG" \
            --maintainer "$MAINTAINER" --repo "$GITHUB_REPOSITORY" --sbom "build/vimma-$v.cdx.json" \
            --ctl-component ctl/vimma-ctl.cdx.json \
            --appimagetool "$RUNNER_TEMP/appimagetool/appimagetool" \
            --runtime "$RUNNER_TEMP/appimagetool/runtime-x86_64"
          node tools/package/validate-sbom.mjs "dist/vimma-$v.cdx.json"
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Smoke test the .deb and the AppImage
        run: |
          v=${TAG#v}
          line=$(node tools/release/version-line.mjs)
          sudo apt-get install -y -q "./dist/vimma_${v}_amd64.deb"
          [ "$(vimma --version)" = "$line" ] || { echo "::error::.deb: $(vimma --version)"; exit 1; }
          # vimma-ctl ships in every package with the browser's version (spec ship-vimma-ctl).
          ctl="vimma-ctl $v (protocol 2)"
          [ "$(vimma-ctl --version)" = "$ctl" ] || { echo "::error::.deb: $(vimma-ctl --version)"; exit 1; }
          test -s /usr/lib/vimma/vimma-ctl-licenses/musl-COPYRIGHT
          desktop-file-validate /usr/share/applications/vimma-vimma.desktop
          test -x /usr/bin/vimma-open
          # The update check's install type (spec m6a-updater §3): a .deb is updated by apt, an
          # AppImage by a new AppImage; only the unmarked tarball is told to unpack over itself.
          type=$(node tools/package/install-type.mjs /usr/lib/vimma)
          [ "$type" = deb ] || { echo "::error::.deb: install type $type"; exit 1; }
          # A separate assignment, so a tar failure stops the step under bash -e.
          listing=$(tar -tJf "./dist/vimma-$v-linux-x86_64.tar.xz")
          case "$listing" in *is-packaged-app*) echo "::error::the tarball carries is-packaged-app"; exit 1 ;; esac
          case "$listing" in *"vimma/vimma-ctl"*) ;; *) echo "::error::the tarball has no vimma/vimma-ctl"; exit 1 ;; esac
          case "$listing" in *"vimma/vimma-ctl-licenses/musl-COPYRIGHT"*) ;; *) echo "::error::the tarball has no vimma-ctl notices"; exit 1 ;; esac
          p=$(mktemp -d)
          # First run creates the profile; --screenshot on a fresh profile races the bookmarks
          # import (docs/runbook.md, Smoke check). timeout exits 124.
          timeout 30 vimma --headless --no-remote --profile "$p" about:blank || true
          timeout 60 vimma --headless --no-remote --profile "$p" --screenshot "$RUNNER_TEMP/shot.png" "data:text/html,<h1>ok</h1>"
          test -s "$RUNNER_TEMP/shot.png"
          out=$(APPIMAGE_EXTRACT_AND_RUN=1 "./dist/vimma-$v-x86_64.AppImage" --version)
          [ "$out" = "$line" ] || { echo "::error::AppImage: $out"; exit 1; }
          appimage="$PWD/dist/vimma-$v-x86_64.AppImage"
          # A link named vimma-ctl to the AppImage runs the client inside it (AppRun reads $ARGV0).
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$appimage" "$RUNNER_TEMP/bin/vimma-ctl"
          [ "$(APPIMAGE_EXTRACT_AND_RUN=1 "$RUNNER_TEMP/bin/vimma-ctl" --version)" = "$ctl" ] \
            || { echo "::error::AppImage as vimma-ctl: wrong version"; exit 1; }
          (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract > /dev/null)
          # Without $APPIMAGE, so the type comes from the AppDir's marker alone (decision 34).
          type=$(env -u APPIMAGE node tools/package/install-type.mjs "$RUNNER_TEMP/squashfs-root/usr/lib/vimma")
          [ "$type" = appimage ] || { echo "::error::AppImage: install type $type"; exit 1; }

      # dnf on Fedora and zypper on openSUSE, each in a container pinned by digest (spec
      # rpm-package): the requirements rpmbuild read from the binaries resolve on both, and the
      # installed Vimma starts.
      - name: Smoke test the .rpm on Fedora and openSUSE
        run: tools/package/rpm-smoke.sh dist "$(node tools/release/version-line.mjs)"

      # makepkg -si in an Arch Linux container, with the tarball served from dist/ on localhost
      # (the draft has no assets yet, and a draft's download URLs answer 404 to anyone); the
      # PKGBUILD's pinned SHA-256 still checks the bytes.
      - name: Smoke test the PKGBUILD on Arch Linux
        run: tools/package/arch-smoke.sh dist "$(node tools/release/version-line.mjs)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          include-hidden-files: true # dist/aur/.SRCINFO; dist/notes/ goes into the release notes
          retention-days: 7
          if-no-files-found: error

  # cosign keyless: the certificate names this workflow at refs/heads/main (IDENTITY_REGEXP in
  # tools/package/package.mjs). Only this job can mint an OIDC token; it runs no repository code.
  sign:
    needs: package
    if: >-
      vars.RELEASE_ENABLED == 'true' && github.repository == 'vimma-browser/vimma' &&
      github.ref == 'refs/heads/main' &&
      vars.SIGNING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign every asset
        run: |
          for f in dist/vimma* dist/PKGBUILD dist/SRCINFO dist/SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signatures
          path: dist/*.sigstore.json
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [build, package, sign]
    # sign is skipped while SIGNING_ENABLED is unset; publish then uploads unsigned assets.
    if: >-
      always() && vars.RELEASE_ENABLED == 'true' && github.repository == 'vimma-browser/vimma' &&
      github.ref == 'refs/heads/main' &&
      needs.package.result == 'success' &&
      (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # upload the release assets
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.build.outputs.sha }}
      REPLACE_PUBLISHED: ${{ inputs.replace_published }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.sign.result == 'success'
        with:
          name: signatures
          path: dist

      # gh finds a draft by the tag it will create (its draft lookup), so this uploads to the
      # draft release-please made. Builds are not bit-for-bit reproducible, so new files under a
      # published release would no longer match the PKGBUILD the AUR has or a SHA256SUMS users
      # saved: a published release is replaced only when the run asks for it.
      - name: Upload to the GitHub Release
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft) \
            || { echo "::error::no GitHub Release for $TAG (release-please creates it)"; exit 1; }
          if [ "$draft" != true ] && [ "$REPLACE_PUBLISHED" != true ]; then
            echo "::error::$TAG is published; re-run with -f replace_published=true to replace its assets"
            exit 1
          fi
          [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)" = "$SHA" ] \
            || { echo "::error::$TAG no longer points to $SHA, the commit that was built"; exit 1; }
          # --clobber: a re-run replaces the assets of a failed one.
          gh release upload "$TAG" dist/vimma* dist/PKGBUILD* dist/SRCINFO* dist/SHA256SUMS* --clobber --repo "$GITHUB_REPOSITORY"

      # The update steps go above release-please's changelog: Vimma 0.1.6 on a Mac shows the
      # Linux tarball command, and links to these notes. They are added whether or not macOS
      # releases are on, since the macOS jobs upload the .dmg after this step.
      - name: Add the update steps and the third-party notice to the release notes
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          # Each part once per release: a re-run finds its heading and leaves it alone.
          changed=false
          if ! grep -q '^### Updating$' notes.md; then
            { cat dist/notes/updating.md; echo; cat notes.md; } > notes.new
            mv notes.new notes.md
            changed=true
          fi
          if ! grep -q '^### Third-party notice$' notes.md; then
            { echo; cat dist/notes/third-party.md; } >> notes.md
            changed=true
          fi
          if [ "$changed" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          fi
          # An edit that leaves the tag out detaches a draft from it, and publishing it
          # would then tag main's head (#311). gh release edit resends it; check it held.
          [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" = "$TAG" ] \
            || { echo "::error::the release is no longer on $TAG"; exit 1; }

  # macOS (spec macos-build, decisions 12 and 13; ADR-018): the Apple Silicon .dmg, cross-compiled
  # on Linux, run on a hosted Mac, signed and added to the same release. No Linux job needs these,
  # so a macOS failure never holds back a Linux release; the failure job still reports it. Off
  # until the repository variable MACOS_RELEASE_ENABLED is `true` (docs/runbook.md, "macOS build").
  # The Homebrew cask, vimma.rb, is rendered beside the dmg and travels with it (spec
  # macos-homebrew, decision 9); homebrew.yml pushes the published release's copy to the tap.
  # vimma-ctl for the Mac (spec ship-vimma-ctl), built natively on a hosted Mac, since the
  # cross-build runner has no linker for a standalone Mach-O binary. It checks the tag as build
  # does; macos-build then refuses a binary from any other commit and signs it into the app.
  macos-ctl:
    if: >-
      vars.RELEASE_ENABLED == 'true' && github.repository == 'vimma-browser/vimma' &&
      github.ref == 'refs/heads/main' &&
      vars.MACOS_RELEASE_ENABLED == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Check the tag's form
        run: |
          echo "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "::error::'$TAG' is not a vX.Y.Z release tag"; exit 1; }

      - name: The tag is on main
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
          echo "$sha" | grep -Eqx '[0-9a-f]{40}' || { echo "::error::$TAG: no commit"; exit 1; }
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...refs/heads/main" --jq .status)
          case "$status" in
            ahead|identical) ;;
            *) echo "::error::$TAG ($sha) is not on main (compare: $status)"; exit 1 ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.sha }}
          persist-credentials: false

      - name: Build vimma-ctl
        working-directory: tools/vimma-ctl
        run: |
          rustup toolchain install
          cargo build --release --locked

      - name: Check the binary
        run: |
          bin=tools/vimma-ctl/target/release/vimma-ctl
          lipo -archs "$bin" | grep -qx arm64 || { echo "::error::vimma-ctl is not arm64"; exit 1; }
          version=$("$bin" --version)
          [ "$version" = "vimma-ctl ${TAG#v} (protocol 2)" ] || { echo "::error::vimma-ctl --version is '$version'"; exit 1; }
          mkdir ctl
          cp "$bin" ctl/vimma-ctl

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Rust's standard library notices, from the toolchain that built the binary (#516); macOS
      # provides libc and the unwinder. The release SBOM describes the Linux packages only.
      - name: Notices for vimma-ctl
        run: |
          node tools/package/ctl-notices.mjs --out ctl/vimma-ctl-licenses

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-ctl
          path: ctl/
          retention-days: 7
          if-no-files-found: error

  # As build: the same tag checks, verified source, no cache, the Safe Browsing key (B6).
  macos-build:
    needs: macos-ctl
    if: >-
      vars.RELEASE_ENABLED == 'true' && github.repository == 'vimma-browser/vimma' &&
      github.ref == 'refs/heads/main' &&
      vars.MACOS_RELEASE_ENABLED == 'true'
    environment: build
    runs-on: ubuntu-24.04
    # As the weekly macOS build: about 1.5 times its measured 133 min (docs/runbook.md, "macOS
    # build").
    timeout-minutes: 200
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      # The hash of the signed app's manifest, for macos-notarise: a job's outputs cannot be
      # changed by another job, while an artifact can be replaced by any job of the run.
      manifest_sha256: ${{ steps.package.outputs.manifest_sha256 }}
    steps:
      - name: Check the tag's form
        run: |
          echo "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "::error::'$TAG' is not a vX.Y.Z release tag"; exit 1; }

      - name: The tag is on main
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
          echo "$sha" | grep -Eqx '[0-9a-f]{40}' || { echo "::error::$TAG: no commit"; exit 1; }
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...refs/heads/main" --jq .status)
          case "$status" in
            ahead|identical) ;;
            *) echo "::error::$TAG ($sha) is not on main (compare: $status)"; exit 1 ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: vimma-ctl comes from the same commit
        env:
          CTL_SHA: ${{ needs.macos-ctl.outputs.sha }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          [ "$CTL_SHA" = "$SHA" ] || { echo "::error::macos-ctl built $CTL_SHA, the tag is now $SHA"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-ctl
          path: ctl

      # No `cache` input: a build restores nothing from the Actions cache (B2).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: Fresh objdir and compiler cache for this release
        run: |
          objdir="$GITHUB_WORKSPACE/engine/obj-macos"
          cache="$RUNNER_TEMP/sccache-macos"
          "$HOME/.mozbuild/sccache/sccache" --stop-server || true
          rm -rf "$objdir" "$cache"
          mkdir -p "$cache"
          { echo "MOZ_OBJDIR=$objdir"; echo "SCCACHE_DIR=$cache"; } >> "$GITHUB_ENV"

      - name: The tag matches surfer.json's version
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { releaseVersion } from "./tools/package/package.mjs";
            const config = JSON.parse(readFileSync("surfer.json", "utf8"));
            console.log("Vimma " + releaseVersion(config, process.env.TAG));'

      - name: Disk guard (a full build and its swap file need about 42 GB)
        run: |
          df -h . | tail -1
          free=$(df --output=avail -BG . | tail -1 | tr -dc 0-9)
          if [ "$free" -lt 50 ]; then
            echo "::error::Only ${free} GB free; the build and its swap file need about 42 GB."
            exit 1
          fi

      - name: Swap file (16 GB)
        run: |
          sudo fallocate -l 16G /vimma-swapfile
          sudo chmod 600 /vimma-swapfile
          sudo mkswap /vimma-swapfile > /dev/null
          sudo swapon /vimma-swapfile
          free -g

      - name: Firefox source (surfer.json), verified and freshly extracted
        run: tools/upstream/firefox-source.sh

      - name: Safe Browsing key file
        env:
          SAFEBROWSING_API_KEY: ${{ secrets.SAFEBROWSING_API_KEY }}
        run: |
          if [ -z "$SAFEBROWSING_API_KEY" ]; then
            echo "::error::secret SAFEBROWSING_API_KEY is not set; a release must have the key"
            exit 1
          fi
          keyfile="$RUNNER_TEMP/vimma-safebrowsing.key"
          (umask 077 && printf '%s' "$SAFEBROWSING_API_KEY" > "$keyfile")
          echo "VIMMA_SAFEBROWSING_KEYFILE=$keyfile" >> "$GITHUB_ENV"

      - name: Import patches and our sources
        run: npm run import

      # As the weekly macOS build: the runner's rustup toolchain has only the host's standard library.
      - name: Rust standard library for aarch64-apple-darwin
        run: rustup target add aarch64-apple-darwin

      # SURFER_PLATFORM picks configs/macos/mozconfig (--target=aarch64-apple-darwin).
      - name: Build
        env:
          SURFER_PLATFORM: darwin
        run: |
          rm -rf engine/.git
          npx --no -- surfer build

      - name: rcodesign (pinned)
        run: tools/package/fetch-rcodesign.sh "$RUNNER_TEMP/rcodesign"

      # mach package, then tools/package/macos-dmg.sh: unpack, ad hoc sign, pack (ADR-018), then
      # the Homebrew cask for that dmg. Their own SHA256SUMS-macos keeps SHA256SUMS, which the AUR
      # and the updater read, as it is.
      - name: Package, ad hoc sign and checksum the dmg
        id: package
        env:
          RCODESIGN: ${{ runner.temp }}/rcodesign/rcodesign
          # signed into Vimma.app/Contents/MacOS with the app (spec ship-vimma-ctl)
          VIMMA_CTL: ${{ github.workspace }}/ctl/vimma-ctl
          # its notices, into Vimma.app/Contents/Resources (#516)
          VIMMA_CTL_LICENSES: ${{ github.workspace }}/ctl/vimma-ctl-licenses
          # the signed app's manifest; its hash is the job output macos-notarise checks against
          VIMMA_APP_MANIFEST: ${{ vars.MACOS_SIGNING == 'developer-id' && format('{0}/vimma-app.manifest', runner.temp) || '' }}
        run: |
          # download-artifact does not keep the mode
          chmod 755 "$VIMMA_CTL"
          (cd engine && ./mach package)
          rm -rf release-macos && mkdir release-macos
          dmg="vimma-${TAG#v}-macos-aarch64.dmg"
          tools/package/macos-dmg.sh "$MOZ_OBJDIR"/dist/vimma-*.en-US.mac.dmg "release-macos/$dmg"
          node tools/package/cask.mjs --tag "$TAG" --dmg "release-macos/$dmg" --out release-macos/vimma.rb
          (cd release-macos && sha256sum "$dmg" vimma.rb > SHA256SUMS-macos && cat SHA256SUMS-macos)
          if [ -n "$VIMMA_APP_MANIFEST" ]; then
            echo "manifest_sha256=$(sha256sum < "$VIMMA_APP_MANIFEST" | cut -d " " -f 1)" >> "$GITHUB_OUTPUT"
          fi

      # macos-unpack and macos-pack have no engine/ to run mach in, so they get the disk-image tools
      # this job's mach bootstrapped, found as make_dmg.py finds them
      # (python/mozbuild/mozbuild/action), for the same runner image. macos-notarise, which holds
      # the Apple secrets, never gets them.
      - name: Disk-image tools for macos-unpack
        if: vars.MACOS_SIGNING == 'developer-id'
        run: |
          mkdir dmg-tools
          (cd engine && ./mach python -c '
          import buildconfig
          from mozbuild.bootstrap import bootstrap_toolchain
          s = buildconfig.substs
          print(s.get("DMG_TOOL") or bootstrap_toolchain("dmg/dmg"))
          print(s.get("HFS_TOOL") or bootstrap_toolchain("dmg/hfsplus"))
          print(s.get("MKFSHFS") or bootstrap_toolchain("hfsplus/newfs_hfs"))') > dmg-tools.txt
          n=1
          for name in dmg hfsplus newfs_hfs; do
            path=$(tail -n 3 dmg-tools.txt | sed -n "${n}p")
            [ -x "$path" ] || { cat dmg-tools.txt; echo "::error::mach found no $name tool"; exit 1; }
            cp "$path" "dmg-tools/$name"
            n=$((n + 1))
          done
          ls -l dmg-tools

      - name: Say the dmg is ad hoc signed
        if: vars.MACOS_SIGNING != 'developer-id'
        run: |
          {
            echo "### macOS: ad hoc signed, not notarised"
            echo
            echo "The repository variable MACOS_SIGNING is not \`developer-id\`, so this release's"
            echo "\`.dmg\` is ad hoc signed and not notarised: Gatekeeper refuses its first open until"
            echo "the user chooses Open Anyway (docs/runbook.md, \"macOS in a release\")."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::the macOS dmg is ad hoc signed and not notarised (MACOS_SIGNING is not developer-id)"

      - name: Delete the Safe Browsing key file
        if: always()
        run: rm -f "$RUNNER_TEMP/vimma-safebrowsing.key"

      - name: Stop the release compiler cache
        if: always()
        run: |
          "$HOME/.mozbuild/sccache/sccache" --stop-server || true
          rm -rf "$RUNNER_TEMP/sccache-macos"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: release-macos/
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: vars.MACOS_SIGNING == 'developer-id'
        with:
          name: macos-dmg-tools
          path: dmg-tools/
          retention-days: 1
          if-no-files-found: error

  # Developer ID (spec macos-build, decisions 23 to 28), only while the repository variable
  # MACOS_SIGNING is `developer-id`; then a missing secret fails the release rather than shipping
  # an ad hoc dmg. Three jobs, each on its own runner, so that the disk-image tools macos-build
  # hands over never run on a runner that holds the Apple secrets (docs/security.md, B14):
  # macos-unpack opens the ad hoc dmg with them, macos-notarise signs, notarises and staples the app
  # with the pinned rcodesign alone, and macos-pack packs the signed app with them again and
  # replaces the `macos` artifact. They run before macos-smoke, so the hosted Mac checks what is
  # published.
  macos-unpack:
    needs: macos-build
    if: >-
      vars.RELEASE_ENABLED == 'true' && github.repository == 'vimma-browser/vimma' &&
      github.ref == 'refs/heads/main' &&
      vars.MACOS_RELEASE_ENABLED == 'true' &&
      vars.MACOS_SIGNING == 'developer-id'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.macos-build.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos
          path: release-macos

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-dmg-tools
          path: dmg-tools

      # tar keeps the app's links and modes, which an artifact's zip would lose.
      - name: Unpack the ad hoc dmg
        env:
          DMG_TOOLS: ${{ github.workspace }}/dmg-tools
        run: |
          (cd release-macos && sha256sum -c SHA256SUMS-macos)
          # download-artifact does not keep the mode
          chmod 755 dmg-tools/dmg dmg-tools/hfsplus dmg-tools/newfs_hfs
          dmg="vimma-${TAG#v}-macos-aarch64.dmg"
          tools/package/macos-dmg-unpack.sh "release-macos/$dmg" volume
          tar -C volume -cf macos-volume.tar .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-volume
          path: macos-volume.tar
          retention-days: 1
          if-no-files-found: error

  # The only job with the Apple secrets, from the macos-sign environment, which only main may deploy
  # from. It runs the pinned rcodesign (fetch-rcodesign.sh checks its SHA-256) and
  # tools/package/macos-sign-app.sh, and no program the build produced: the volume arrives as
  # data, is unpacked and its links checked before any credential is written.
  macos-notarise:
    needs: [macos-build, macos-unpack]
    if: >-
      vars.RELEASE_ENABLED == 'true' && github.repository == 'vimma-browser/vimma' &&
      github.ref == 'refs/heads/main' &&
      vars.MACOS_RELEASE_ENABLED == 'true' &&
      vars.MACOS_SIGNING == 'developer-id'
    environment: macos-sign
    # `shell: bash` runs each step with -eo pipefail; GitHub's default bash -e has no pipefail
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-24.04
    # Notarisation usually answers in minutes (Zen: 6.5 minutes); rcodesign waits up to an hour.
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.macos-build.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-volume
          path: macos-volume

      - name: rcodesign (pinned)
        run: |
          tools/package/fetch-rcodesign.sh "$RUNNER_TEMP/rcodesign"

      # The app must be the one macos-dmg.sh signed ad hoc in macos-build: the hash of its manifest
      # is a job output of macos-build, which no other job can change, so a replaced unpack tool
      # cannot have changed the app; checked before any credential exists.
      - name: The unsigned app
        env:
          MANIFEST_SHA256: ${{ needs.macos-build.outputs.manifest_sha256 }}
        run: |
          mkdir "$RUNNER_TEMP/volume"
          tar -xf macos-volume/macos-volume.tar --no-same-owner -C "$RUNNER_TEMP/volume" ./Vimma.app
          # the script's own exit status decides: a manifest it stopped writing is never hashed
          if ! tools/package/macos-app-manifest.sh "$RUNNER_TEMP/volume/Vimma.app" > "$RUNNER_TEMP/unpacked.manifest"; then
            echo "::error::the manifest of Vimma.app from macos-unpack could not be made"
            exit 1
          fi
          sum=$(sha256sum < "$RUNNER_TEMP/unpacked.manifest")
          [[ $MANIFEST_SHA256 =~ ^[0-9a-f]{64}$ ]] || { echo "::error::macos-build gave no manifest hash"; exit 1; }
          [ "${sum%% *}" = "$MANIFEST_SHA256" ] ||
            { echo "::error::Vimma.app from macos-unpack is not the app macos-build signed"; exit 1; }

      # Files only the runner's user can read, written by the shell's printf builtin, so no secret
      # is on a command line, in the log or in an artifact.
      - name: Signing credentials
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=
          for name in APPLE_DEVELOPER_ID_P12 APPLE_DEVELOPER_ID_P12_PASSWORD APPLE_NOTARY_API_KEY APPLE_TEAM_ID; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::secret $name is not set in the macos-sign environment, and MACOS_SIGNING is developer-id"
              missing=1
            fi
          done
          [ -z "$missing" ] || exit 1
          dir="$RUNNER_TEMP/apple-signing"
          (
            umask 077
            mkdir "$dir"
            printf '%s' "$APPLE_DEVELOPER_ID_P12" | base64 -d > "$dir/developer-id.p12"
            printf '%s' "$APPLE_DEVELOPER_ID_P12_PASSWORD" > "$dir/p12-password"
            printf '%s' "$APPLE_NOTARY_API_KEY" > "$dir/notary-api-key.json"
          )

      - name: Sign with the Developer ID, notarise and staple
        env:
          RCODESIGN: ${{ runner.temp }}/rcodesign/rcodesign
          APPLE_P12_FILE: ${{ runner.temp }}/apple-signing/developer-id.p12
          APPLE_P12_PASSWORD_FILE: ${{ runner.temp }}/apple-signing/p12-password
          APPLE_NOTARY_API_KEY_FILE: ${{ runner.temp }}/apple-signing/notary-api-key.json
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          tools/package/macos-sign-app.sh "$RUNNER_TEMP/volume/Vimma.app"

      - name: Delete the signing credentials
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/apple-signing"

      - name: The signed app
        run: |
          tar -C "$RUNNER_TEMP/volume" -cf macos-signed-app.tar Vimma.app

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-signed-app
          path: macos-signed-app.tar
          retention-days: 1
          if-no-files-found: error

  # The signed app back into the volume with its art, packed with the disk-image tools on a runner
  # that never held a credential; then the cask without its Open Anyway caveat and the checksums.
  macos-pack:
    needs: [macos-build, macos-unpack, macos-notarise]
    if: >-
      vars.RELEASE_ENABLED == 'true' && github.repository == 'vimma-browser/vimma' &&
      github.ref == 'refs/heads/main' &&
      vars.MACOS_RELEASE_ENABLED == 'true' &&
      vars.MACOS_SIGNING == 'developer-id'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.macos-build.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos
          path: release-macos

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-volume
          path: macos-volume

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-signed-app
          path: macos-signed-app

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-dmg-tools
          path: dmg-tools

      - name: Pack the signed app
        env:
          DMG_TOOLS: ${{ github.workspace }}/dmg-tools
        run: |
          chmod 755 dmg-tools/dmg dmg-tools/hfsplus dmg-tools/newfs_hfs
          mkdir volume
          tar -xf macos-volume/macos-volume.tar -C volume
          rm -rf volume/Vimma.app
          tar -xf macos-signed-app/macos-signed-app.tar -C volume
          dmg="vimma-${TAG#v}-macos-aarch64.dmg"
          tools/package/macos-dmg-pack.sh volume "release-macos/$dmg"

      - name: The cask and checksums for the signed dmg
        run: |
          dmg="vimma-${TAG#v}-macos-aarch64.dmg"
          node tools/package/cask.mjs --notarised --tag "$TAG" --dmg "release-macos/$dmg" --out release-macos/vimma.rb
          (cd release-macos && sha256sum "$dmg" vimma.rb > SHA256SUMS-macos && cat SHA256SUMS-macos)
          {
            echo "### macOS: Developer ID, notarised and stapled"
            echo
            echo "\`$dmg\` holds Vimma.app signed with Vimma's Developer ID Application certificate,"
            echo "under the hardened runtime, notarised by Apple and stapled. macos-smoke checks it"
            echo "with codesign, spctl and stapler on a Mac."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: release-macos/
          overwrite: true
          retention-days: 7
          if-no-files-found: error

  # A hosted Mac runs what was built: checksum, signature, arm64, the version line against the
  # tag, the Safe Browsing key, a page rendered headless, and the Homebrew cask installing the dmg;
  # for a Developer ID release also the Developer ID of Vimma's team, notarisation and Gatekeeper.
  # Once MACOS_SIGNING is developer-id, it never takes the ad hoc dmg in place of a skipped or
  # failed macos-pack. !cancelled(), not always(), so that cancelling the run stops it.
  macos-smoke:
    needs: [macos-build, macos-pack]
    if: >-
      !cancelled() && vars.RELEASE_ENABLED == 'true' && github.repository == 'vimma-browser/vimma' &&
      github.ref == 'refs/heads/main' &&
      vars.MACOS_RELEASE_ENABLED == 'true' &&
      needs.macos-build.result == 'success' &&
      (needs.macos-pack.result == 'success' ||
      (needs.macos-pack.result == 'skipped' && vars.MACOS_SIGNING != 'developer-id'))
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.macos-build.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos
          path: release-macos

      - name: Mount the dmg and copy the app out
        run: |
          (cd release-macos && shasum -a 256 -c SHA256SUMS-macos)
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/vimma-dmg" \
            "release-macos/vimma-${TAG#v}-macos-aarch64.dmg"
          # Vimma's window art and volume icon, kept through the repack (spec macos-homebrew)
          tools/package/macos-dmg-check.sh "$RUNNER_TEMP/vimma-dmg"
          ditto "$RUNNER_TEMP/vimma-dmg/Vimma.app" "$RUNNER_TEMP/Vimma.app"
          hdiutil detach "$RUNNER_TEMP/vimma-dmg"
          echo "APP=$RUNNER_TEMP/Vimma.app" >> "$GITHUB_ENV"

      - name: Smoke check
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/vimma" | grep -qx arm64
          version=$("$APP/Contents/MacOS/vimma" --version)
          expected=$(node tools/release/version-line.mjs)
          case "$expected" in "Vimma ${TAG#v} · Firefox "*) ;; *) echo "::error::surfer.json gives '$expected', tag is $TAG"; exit 1 ;; esac
          [ "$version" = "$expected" ] || { echo "::error::--version is '$version', want '$expected'"; exit 1; }
          ctl=$("$APP/Contents/MacOS/vimma-ctl" --version)
          [ "$ctl" = "vimma-ctl ${TAG#v} (protocol 2)" ] || { echo "::error::vimma-ctl --version is '$ctl'"; exit 1; }
          test -s "$APP/Contents/Resources/vimma-ctl-licenses/rust-std-COPYRIGHT.html"
          appconstants=$(unzip -p "$APP/Contents/Resources/omni.ja" modules/AppConstants.sys.mjs)
          echo "$appconstants" | grep -q 'MOZ_GOOGLE_SAFEBROWSING_API_KEY' \
            || { echo "::error::no Safe Browsing key constant in AppConstants"; exit 1; }
          if echo "$appconstants" | grep -q '"no-google-safebrowsing-api-key"'; then
            echo "::error::built without the Safe Browsing key"; exit 1
          fi
          profile=$(mktemp -d)
          shot="$RUNNER_TEMP/vimma-smoke.png"
          "$APP/Contents/MacOS/vimma" --headless --no-remote --profile "$profile" \
            --screenshot "$shot" 'data:text/html,<h1>Vimma</h1>' &
          pid=$!
          ( sleep 240; kill "$pid" 2> /dev/null ) &
          wait "$pid"
          test -s "$shot"
          # Vimma's icon and bundle identifier (spec macos-homebrew), as the weekly smoke checks
          tools/package/macos-app-check.sh "$APP"

      # codesign -dvv, spctl --assess and stapler validate (spec macos-build, decision 23).
      - name: Developer ID, notarisation and Gatekeeper
        if: vars.MACOS_SIGNING == 'developer-id'
        env:
          # Vimma's Apple team ID, public in every signature, so a variable, not a secret
          EXPECTED_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: |
          tools/package/macos-developer-id-check.sh "$APP"

      # brew style, an offline brew audit, then brew install --cask from the dmg in Homebrew's
      # download cache and brew uninstall --zap (spec macos-homebrew, decision 9).
      - name: The Homebrew cask installs the dmg
        run: |
          tools/package/cask-check.sh release-macos/vimma.rb "release-macos/vimma-${TAG#v}-macos-aarch64.dmg"

  # As sign: cosign keyless, the same identity (release.yml at refs/heads/main); no repository code.
  macos-sign:
    needs: [macos-build, macos-smoke]
    # !cancelled() with the results: the signing jobs, ancestors, are skipped for an ad hoc release,
    # and a skipped ancestor would skip this job too; a cancelled run still stops it.
    if: >-
      !cancelled() && vars.RELEASE_ENABLED == 'true' && github.repository == 'vimma-browser/vimma' &&
      github.ref == 'refs/heads/main' &&
      needs.macos-build.result == 'success' && needs.macos-smoke.result == 'success' &&
      vars.MACOS_RELEASE_ENABLED == 'true' &&
      vars.SIGNING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos
          path: dist

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the dmg, the cask and their checksums
        run: |
          for f in dist/vimma-*-macos-aarch64.dmg dist/vimma.rb dist/SHA256SUMS-macos; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-signatures
          path: dist/*.sigstore.json
          retention-days: 7
          if-no-files-found: error

  macos-publish:
    needs: [macos-build, macos-smoke, macos-sign]
    if: >-
      !cancelled() && vars.RELEASE_ENABLED == 'true' && github.repository == 'vimma-browser/vimma' &&
      github.ref == 'refs/heads/main' &&
      vars.MACOS_RELEASE_ENABLED == 'true' &&
      needs.macos-smoke.result == 'success' &&
      (needs.macos-sign.result == 'success' || needs.macos-sign.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # upload the macOS release assets
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.macos-build.outputs.sha }}
      REPLACE_PUBLISHED: ${{ inputs.replace_published }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.macos-sign.result == 'success'
        with:
          name: macos-signatures
          path: dist

      # The macOS build ends hours after the Linux one, often after the release is published.
      # Adding the macOS files then changes nothing users, the AUR or the updater already have;
      # replacing macOS files a published release already has needs replace_published, as publish.
      - name: Add the dmg to the GitHub Release
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft) \
            || { echo "::error::no GitHub Release for $TAG (release-please creates it)"; exit 1; }
          if [ "$draft" != true ] && [ "$REPLACE_PUBLISHED" != true ]; then
            present=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '[.assets[].name | select(test("-macos-aarch64\\.dmg|^vimma\\.rb|^SHA256SUMS-macos"))] | length')
            if [ "$present" != 0 ]; then
              echo "::error::$TAG is published with macOS files; re-run with -f replace_published=true to replace them"
              exit 1
            fi
          fi
          [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)" = "$SHA" ] \
            || { echo "::error::$TAG no longer points to $SHA, the commit that was built"; exit 1; }
          gh release upload "$TAG" dist/vimma-*-macos-aarch64.dmg* dist/vimma.rb* dist/SHA256SUMS-macos* --clobber --repo "$GITHUB_REPOSITORY"

  # The macOS files usually reach a release after it is published, when homebrew.yml's start job
  # found no cask. Once vimma.rb is on a published release (releases/download/ serves nothing
  # for a draft), this starts homebrew.yml on main for the tag; for a draft published after its
  # macOS files, publishing starts homebrew.yml, whose start job then finds the cask. Likewise the macOS
  # update manifest (spec macos-homebrew, decision 16): update-publish.yml for target macos,
  # which update-publish.yml itself starts when a draft is published after its .dmg.
  # No repository code, and no token beyond starting a workflow.
  macos-tap:
    needs: macos-publish
    # as macos-sign: an ad hoc release skips the signing jobs, its ancestors
    if: >-
      !cancelled() && vars.RELEASE_ENABLED == 'true' && github.repository == 'vimma-browser/vimma' &&
      github.ref == 'refs/heads/main' &&
      needs.macos-publish.result == 'success' &&
      vars.MACOS_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # start homebrew.yml and update-publish.yml (workflow_dispatch)
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start homebrew.yml for a published release
        run: |
          if curl -fsSL -o /dev/null "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/vimma.rb"; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/homebrew.yml/dispatches" \
              -f ref=main -f "inputs[tag]=$TAG"
            echo "Started homebrew.yml for $TAG" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::$TAG is a draft; publishing it starts homebrew.yml, which pushes the cask"
          fi

      - name: Start update-publish.yml for the macOS manifest
        if: vars.UPDATES_ENABLED == 'true'
        run: |
          if curl -fsSIL --proto =https -o /dev/null "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/vimma-${TAG#v}-macos-aarch64.dmg"; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/update-publish.yml/dispatches" \
              -f ref=main -f "inputs[tag]=$TAG" -f "inputs[target]=macos"
            echo "Started update-publish.yml (macos) for $TAG" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::$TAG is a draft; publishing it starts update-publish.yml, which adds the macOS manifest"
          fi

  failure:
    needs:
      - build
      - ctl
      - package
      - sign
      - publish
      - macos-ctl
      - macos-build
      - macos-unpack
      - macos-notarise
      - macos-pack
      - macos-smoke
      - macos-sign
      - macos-publish
      - macos-tap
    if: >-
      failure() && vars.RELEASE_ENABLED == 'true' && github.repository == 'vimma-browser/vimma' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # open or comment on the release-failure issue
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the failure issue
        run: |
          gh label create release-failure --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "release.yml failed" --force
          body="Release $TAG failed: $RUN_URL. Fix, then re-run: \`gh workflow run release.yml -f tag=$TAG\` (assets are replaced)."
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label release-failure --state open \
            --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Release $TAG failed" \
              --label release-failure --body "$body"
          fi
