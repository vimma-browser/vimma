# Plan §4 step 6 / §7: release-please keeps one release PR open with the next version and its
# CHANGELOG.md entry, built from the Conventional Commits on main. It opens as a draft, whose
# rebuilds skip the slow checks; marking it ready runs them once (issue #443). Merging that PR is
# the release: release-please tags vX.Y.Z and creates the GitHub Release as a draft, and
# release-build starts release.yml, which uploads the packages to that draft; the maintainer
# publishes it. Config:
# release-please-config.json, .release-please-manifest.json; setup in docs/runbook.md (Releases).
# The version's single source of truth is surfer.json brands.vimma.release.displayVersion,
# bumped through extra-files; the Firefox pin (version.version) is never touched.
# Two post-steps name the Firefox the release is built on (spec firefox-versions): firefox-notes
# puts it in the release PR's CHANGELOG.md heading, release-title in the release's title and notes.
# They also carry the hand-written [Unreleased] lines into the release (issue #529): firefox-notes
# moves them into the release PR's entry, release-title adds them to the release's notes.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # release branch, CHANGELOG.md/surfer.json commits, tags, GitHub Release
      pull-requests: write # open and update the release PR
      issues: write # labels ("autorelease: pending/tagged") use the issues API
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      id: ${{ steps.release.outputs.id }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # GITHUB_TOKEN PRs trigger no workflows; an optional fine-grained token (Contents +
          # Pull requests + Issues: read/write, this repo only) makes CI run on the release PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Issue #529: the hand-written `## [Unreleased]` lines move into the release PR's new entry,
  # above release-please's list, leaving an empty `## [Unreleased]` at the top
  # (tools/release/changelog.mjs). Decision 7: that entry's heading gets ` · Firefox <version>`
  # and each Firefox bump line its advisory links (tools/release/firefox-notes.mjs). Both edits are
  # one commit on the release branch. "always-update" makes release-please rebuild the branch from
  # main on every run (a force-push that drops this commit), so the moved lines are always main's
  # and the PR never conflicts with main on CHANGELOG.md; this job applies the edits again in the
  # same run.
  # Main's code runs; the release branch's files are read through the API as data. The commit is
  # pushed with RELEASE_PLEASE_TOKEN, since a GITHUB_TOKEN push would leave the release PR's new
  # head without its required checks; without that token the job only logs a notice.
  firefox-notes:
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # check out main, read the release branch's files
      pull-requests: read # find the open release PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Name the Firefox version in the release PR's changelog
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          BRANCH: release-please--branches--main
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open \
            --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "No open release PR."
            exit 0
          fi
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::notice::RELEASE_PLEASE_TOKEN is not set; #$pr's changelog entry lacks the unreleased lines and the Firefox version (docs/runbook.md, Releases)"
            exit 0
          fi
          dir="$RUNNER_TEMP/firefox-notes"
          mkdir -p "$dir"
          api="repos/$GITHUB_REPOSITORY/contents"
          gh api "$api/surfer.json?ref=$BRANCH" --jq .content | base64 -d > "$dir/surfer.json"
          gh api "$api/CHANGELOG.md?ref=$BRANCH" > "$dir/changelog.json"
          sha=$(jq -r .sha "$dir/changelog.json")
          jq -r .content "$dir/changelog.json" | base64 -d > "$dir/CHANGELOG.md"
          node tools/release/changelog.mjs move "$dir/CHANGELOG.md" > "$dir/moved.md"
          node tools/release/firefox-notes.mjs "$dir/moved.md" --surfer "$dir/surfer.json" \
            > "$dir/new.md"
          if cmp -s "$dir/CHANGELOG.md" "$dir/new.md"; then
            echo "#$pr's changelog entry already has the unreleased lines and the Firefox version."
            exit 0
          fi
          firefox=$(jq -r .version.version "$dir/surfer.json")
          # `sha` is the blob this replaces: if release-please rebuilt the branch since, GitHub
          # refuses the push (409) and the next run applies the edit to the new file.
          jq -n --arg message "chore(release): unreleased lines and firefox $firefox in the changelog entry" \
            --arg branch "$BRANCH" --arg sha "$sha" --rawfile content "$dir/new.md" \
            '{message: $message, branch: $branch, sha: $sha, content: ($content | @base64)}' \
            > "$dir/put.json"
          GH_TOKEN="$PUSH_TOKEN" gh api --method PUT "$api/CHANGELOG.md" --input "$dir/put.json" \
            --jq '"Pushed " + .commit.sha'
          echo "#$pr: CHANGELOG.md entry has the unreleased lines and names Firefox $firefox" \
            >> "$GITHUB_STEP_SUMMARY"

  # Decision 8: the release release-please just created is titled `Vimma <x> · Firefox <y>`
  # (tools/release/version-line.mjs on the tag's surfer.json) and its notes' heading and bump
  # lines get the same edit as the changelog. release-please writes the notes from the release
  # PR's body, which holds only its own list, so the hand-written lines of the tag's CHANGELOG.md
  # entry are added first (issue #529). The notes are transformed, never rewritten, so
  # nothing another job added is lost. Only the name and body change (the PATCH resends the verified
  # tag, which a draft otherwise loses): the release stays a draft.
  release-title:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # edit the release's title and notes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Title the release with Vimma's and Firefox's versions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release-please.outputs.id }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          title=$(node tools/release/version-line.mjs)
          case "$title" in
            "Vimma ${TAG#v} · Firefox "*) ;;
            *) echo "::error::$TAG's surfer.json gives \"$title\""; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/release-title"
          mkdir -p "$dir"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$dir/release.json"
          if [ "$(jq -r .tag_name "$dir/release.json")" != "$TAG" ]; then
            echo "::error::release $RELEASE_ID is not $TAG"
            exit 1
          fi
          jq -j '.body // ""' "$dir/release.json" > "$dir/body.md"
          node tools/release/changelog.mjs notes "$dir/body.md" --changelog CHANGELOG.md --version "${TAG#v}" > "$dir/hand.md"
          node tools/release/firefox-notes.mjs "$dir/hand.md" --surfer surfer.json > "$dir/new.md"
          if [ "$(jq -r .name "$dir/release.json")" = "$title" ] && cmp -s "$dir/body.md" "$dir/new.md"; then
            echo "$TAG is already titled \"$title\"."
            exit 0
          fi
          # tag_name is resent on purpose: a PATCH to a draft that leaves it out detaches the draft
          # from its tag (tag_name becomes untagged-...), and publishing it would then create a new
          # tag on the default branch and build that instead. The response is checked as well.
          jq -n --arg tag "$TAG" --arg name "$title" --rawfile body "$dir/new.md" \
            '{tag_name: $tag, name: $name, body: $body}' |
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --input - \
              > "$dir/edited.json"
          jq -r --arg tag "$TAG" 'if (.tag_name != $tag) then "::error::release left at " +
            .tag_name else "Edited " + .html_url + " (draft: " + (.draft | tostring) + ")" end' \
            "$dir/edited.json"
          [ "$(jq -r .tag_name "$dir/edited.json")" = "$TAG" ] || exit 1
          echo "$TAG: \"$title\"" >> "$GITHUB_STEP_SUMMARY"

  # Starts release.yml for the draft release-please just created, so its packages are built,
  # signed and uploaded while it is still a draft and publishing it is one click on a finished
  # release (docs/runbook.md, "Release packages"). A draft fires no `release` event and a
  # GITHUB_TOKEN tag push starts no workflow, but GITHUB_TOKEN may dispatch one; the dispatch
  # names main, so release.yml runs from main, the identity its signatures carry. It runs no
  # repository code. If it fails or never runs, the same dispatch by hand is the recovery:
  # gh workflow run release.yml -f tag=vX.Y.Z.
  release-build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # start release.yml (workflow_dispatch)
    steps:
      - name: Start release.yml for the new tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          echo "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "::error::'$TAG' is not a vX.Y.Z release tag"; exit 1; }
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" \
            -f ref=main -f "inputs[tag]=$TAG"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/release.yml"
          echo "Started release.yml for $TAG: $url" >> "$GITHUB_STEP_SUMMARY"

  # Decisions 11 to 15 (ADR-020): after a merged upstream bump labelled `security`, the open
  # release PR is set to auto-merge, pinned to its head commit, so GitHub merges it once the main
  # ruleset is satisfied and no person stands between the bump and the release. It runs after
  # firefox-notes so the pinned head already carries that job's changelog commit. Every check is
  # in tools/release/security-release.mjs decide(); off until AUTO_SECURITY_RELEASE is `true`
  # (docs/runbook.md, Releases). Reads and the merge go through the release-please token: a merge
  # made with GITHUB_TOKEN would push to main without starting release-please.yml, so no release
  # would follow. GITHUB_TOKEN only checks out main's code; the release branch is read as data.
  security-release:
    needs: [release-please, firefox-notes]
    if: github.repository == 'vimma-browser/vimma' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AUTO_SECURITY_RELEASE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # check out main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set the release PR to auto-merge after a security bump
        env:
          AUTO_SECURITY_RELEASE: ${{ vars.AUTO_SECURITY_RELEASE }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: node tools/release/security-release.mjs
