# Spec macos-build, sub-PRs 3 and 4: an arm64 macOS build, cross-compiled on a GitHub-hosted Linux
# runner (decision 5), ad hoc signed with rcodesign and packed as a .dmg, then smoked on a hosted
# Mac (decision 8). Its own workflow, never a step of nightly.yml or release.yml, so a macOS-only
# breakage cannot hold back a Linux build (decision 13). Keyless: Safe Browsing is off by default in
# what it builds (decision 14). Measured time and disk: docs/runbook.md, "macOS build".
name: macos

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - configs/macos/**
      - .github/workflows/macos.yml
      - tools/package/fetch-rcodesign.sh
      - tools/package/macos-dmg.sh

permissions: {}

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # As release.yml's build job (spec build-supply-chain, B1, B2 and B5): a standard hosted runner,
  # Firefox source that firefox-source.sh verifies and extracts here, nothing restored from the
  # Actions cache, a fresh objdir and an empty compiler cache.
  build:
    if: github.event_name != 'schedule' || github.repository == 'vimma-browser/vimma'
    runs-on: ubuntu-24.04
    # Not measured yet: the spec estimates 1.5 to 3 hours. Under GitHub's 6 hours, so a hung
    # build fails here with its own log.
    timeout-minutes: 330
    permissions:
      contents: read
    outputs:
      artifact: >-
        vimma-${{ steps.version.outputs.vimma }}-firefox-${{ steps.version.outputs.firefox
        }}-macos-aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `cache` input: a build restores nothing from the Actions cache (B2).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: Versions (surfer.json)
        id: version
        run: |
          echo "vimma=$(node -p 'require("./surfer.json").brands.vimma.release.displayVersion')" >> "$GITHUB_OUTPUT"
          echo "firefox=$(node -p 'require("./surfer.json").version.version')" >> "$GITHUB_OUTPUT"

      - name: Fresh objdir and compiler cache
        run: |
          objdir="$GITHUB_WORKSPACE/engine/obj-macos"
          cache="$RUNNER_TEMP/sccache-macos"
          "$HOME/.mozbuild/sccache/sccache" --stop-server || true
          rm -rf "$objdir" "$cache"
          mkdir -p "$cache"
          { echo "MOZ_OBJDIR=$objdir"; echo "SCCACHE_DIR=$cache"; } >> "$GITHUB_ENV"

      # Before the download, so a runner image that shrank fails in seconds (runbook, "Full
      # builds").
      - name: Disk guard (a full build and its swap file need about 42 GB)
        run: |
          df -h . | tail -1
          free=$(df --output=avail -BG . | tail -1 | tr -dc 0-9)
          if [ "$free" -lt 50 ]; then
            echo "::error::Only ${free} GB free; the build and its swap file need about 42 GB."
            exit 1
          fi

      # The Linux build's Rust stage needs more than the runner's 16 GB of memory (runbook, "Full
      # builds"); the cross build compiles the same crates.
      - name: Swap file (16 GB)
        run: |
          sudo fallocate -l 16G /vimma-swapfile
          sudo chmod 600 /vimma-swapfile
          sudo mkswap /vimma-swapfile > /dev/null
          sudo swapon /vimma-swapfile
          free -g

      # Verified against Mozilla's SHA512SUMS and extracted afresh in this job (B1, B2).
      - name: Firefox source (surfer.json), verified and freshly extracted
        run: tools/upstream/firefox-source.sh

      - name: Import patches and our sources
        run: npm run import

      # SURFER_PLATFORM picks configs/macos/mozconfig (--target=aarch64-apple-darwin) and names the
      # bundle Vimma.app. As release.yml: mach must not see engine/'s empty repository, or
      # --enable-bootstrap finds none of Mozilla's toolchains.
      - name: Build
        env:
          SURFER_PLATFORM: darwin
        run: |
          rm -rf engine/.git
          npx --no -- surfer build

      - name: rcodesign (pinned)
        run: tools/package/fetch-rcodesign.sh "$RUNNER_TEMP/rcodesign"

      - name: Package with mach (dist/vimma-<firefox>.en-US.mac.dmg)
        run: |
          (cd engine && ./mach package)
          ls -l "$MOZ_OBJDIR"/dist/*.dmg

      - name: Ad hoc sign and pack the dmg
        env:
          RCODESIGN: ${{ runner.temp }}/rcodesign/rcodesign
          OUT: dmg/vimma-${{ steps.version.outputs.vimma }}-macos-aarch64.dmg
        run: |
          mkdir -p dmg
          tools/package/macos-dmg.sh "$MOZ_OBJDIR"/dist/vimma-*.en-US.mac.dmg "$OUT"
          ls -l dmg
          df -h . | tail -1

      - name: Stop the compiler cache
        if: always()
        run: |
          "$HOME/.mozbuild/sccache/sccache" --stop-server || true
          rm -rf "$RUNNER_TEMP/sccache-macos"

      - name: Upload the dmg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: >-
            vimma-${{ steps.version.outputs.vimma }}-firefox-${{ steps.version.outputs.firefox
            }}-macos-aarch64
          path: dmg/
          retention-days: 90
          if-no-files-found: error

  # Decision 8: a hosted Mac runs what was built. Free on a public repository.
  smoke:
    needs: build
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dmg

      - name: Mount the dmg and copy the app out
        run: |
          set -- dmg/*.dmg
          [ "$#" -eq 1 ] || { echo "::error::want one dmg, got $*"; exit 1; }
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/vimma-dmg" "$1"
          ls -la "$RUNNER_TEMP/vimma-dmg"
          ditto "$RUNNER_TEMP/vimma-dmg/Vimma.app" "$RUNNER_TEMP/Vimma.app"
          hdiutil detach "$RUNNER_TEMP/vimma-dmg"
          echo "APP=$RUNNER_TEMP/Vimma.app" >> "$GITHUB_ENV"

      - name: The signature verifies
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP" 2>&1 | grep -E '^(Identifier|Format|Signature)='
          lipo -archs "$APP/Contents/MacOS/vimma" | grep -qx arm64

      - name: The version line
        run: |
          version=$("$APP/Contents/MacOS/vimma" --version)
          expected=$(node tools/release/version-line.mjs)
          [ "$version" = "$expected" ] || { echo "::error::--version is '$version', want '$expected'"; exit 1; }

      # The first start creates the profile; the screenshot proves a content process renders a
      # page. A watchdog, as macOS has no `timeout`.
      - name: A page renders headless
        run: |
          profile=$(mktemp -d)
          shot="$RUNNER_TEMP/vimma-smoke.png"
          MOZ_HEADLESS=1 "$APP/Contents/MacOS/vimma" --headless --no-remote --profile "$profile" \
            --screenshot "$shot" 'data:text/html,<h1>Vimma</h1>' &
          pid=$!
          ( sleep 240; kill "$pid" 2> /dev/null ) &
          wait "$pid"
          [ -s "$shot" ] || { echo "::error::no screenshot"; exit 1; }
          ls -l "$shot"
