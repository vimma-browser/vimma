# Spec m0-build-strategy, ADR-010: the mochitest browser-chrome suite on an artifact build, on a
# GitHub-hosted runner. The engine is the Firefox release source tarball with our patches and
# front end; the compiled binaries are Mozilla's own build of that exact release (the revision
# in engine/sourcestamp.txt), downloaded from Taskcluster by `mach build`. No self-hosted runner,
# no secrets: safe for pull requests from forks once the repo is public (read-only token). So no
# Google Safe Browsing key either: the build is keyless, as browser_vimma_safebrowsing.js checks
# (spec m0-safebrowsing-key). Never add SAFEBROWSING_API_KEY here.
# Spec m0-e2e-harness: the same job builds vimma-ctl and runs the e2e harness's own tests (fake
# control server, real Xvfb) first, and the socket-driven scenarios on the artifact build last.
# A scenario marked pending is reported as a notice and passes nothing.
# Spec m7-upstream-autopilot: upstream.yml calls this workflow (workflow_call) with a newer
# Firefox version; the job then bumps surfer.json in its own checkout first and runs the same
# suites on that release. Nothing is pushed from here: the token stays read-only.
# Spec upstream-beta-canary, decision 4: a Firefox Beta version (^\d+\.0b\d+$, from the canary or
# a manual run) turns on Beta mode. The checks and suites then run with continue-on-error, so each
# one runs and is reported, and suite-results.json records every failure; the job still fails at
# the end. Any other version, PR CI and the release autopilot included, fails on the first failure.
name: e2e

on:
  pull_request:
    # ready_for_review: PRs opened by bot workflows with GITHUB_TOKEN do not trigger
    # workflows; marking them ready (or a manual run) starts this as the owner.
    types: [opened, synchronize, reopened, ready_for_review]
    # No paths filter: "mochitest (artifact build)" is a required check on main, so it must
    # report on every PR. A docs-only PR skips it with `if:` instead (job changes, issue #245),
    # which GitHub reports as success.
  workflow_dispatch:
    inputs:
      firefox-version:
        description: Firefox version to test instead of surfer.json's (a Beta turns on Beta mode)
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      firefox-version:
        description: Firefox release to test instead of surfer.json's (the upstream autopilot)
        type: string
        required: false
        default: ""
      # The Beta canary passes false (spec upstream-beta-canary, B9): its findings go to its issue
      # and its run stays green. Every other run fails once a Beta-mode step failed.
      fail-on-findings:
        description: In Beta mode, fail the job when a check or suite failed (the default)
        type: boolean
        required: false
        default: true
      # Spec upstream-bump-automation, decision 3: only workflow_call declares it, so a pull
      # request run cannot rewrite prefs and keeps the strict upstream-prefs check below.
      prefs-patch-artifact:
        description: Artifact of the calling run holding prefs-refresh.patch (the autopilot)
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Keyed on the ref and the version: a call from upstream.yml or the Beta canary runs on main's
  # ref, and must never cancel, or be cancelled by, a manual run on main without a version or a
  # manual run of the same version on another branch. A new push to a PR cancels its older run;
  # nothing else cancels a run in progress (tools/test/workflow-concurrency.test.mjs), so a manual
  # run of the version an upstream or Beta call is testing waits for it (GitHub still keeps one
  # queued run per group, the newest). In a call, event_name is the caller's event.
  group: e2e-${{ github.ref }}-${{ inputs.firefox-version }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Issue #245: is this a docs-only pull request? (tools/ci/docs-only.mjs, as the base branch has
  # it, so the pull request cannot change the answer.) Any other event leaves the output empty
  # and everything runs; so does a failed classifier (!cancelled() below, not success()).
  changes:
    name: changes (docs-only?)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0 # base...head needs the merge base
          persist-credentials: false

      - name: Docs-only pull request? (tools/ci/docs-only.mjs, from the base)
        id: classify
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git show "$BASE:tools/ci/docs-only.mjs" > "$RUNNER_TEMP/docs-only.mjs"; then
            node "$RUNNER_TEMP/docs-only.mjs" --event pull_request --base "$BASE" --head "$HEAD"
          else
            echo "No classifier on the base: running everything"
          fi

  mochitest:
    name: mochitest (artifact build)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Beta mode (a Firefox Beta version, spec upstream-beta-canary)
        id: mode
        env:
          VERSION: ${{ inputs.firefox-version }}
        run: |
          if [[ "$VERSION" =~ ^[0-9]+\.0b[0-9]+$ ]]; then beta=true; else beta=false; fi
          echo "beta=$beta" >> "$GITHUB_OUTPUT"

      # --allow-beta only in Beta mode: no release path can pin a Beta by accident.
      - name: Bump surfer.json to the version under test (upstream autopilot, Beta canary)
        id: bump
        if: inputs.firefox-version != ''
        env:
          VERSION: ${{ inputs.firefox-version }}
          BETA: ${{ steps.mode.outputs.beta }}
        run: |
          if [ "$BETA" = true ]; then
            python3 tools/upstream/bump-surfer-json.py --allow-beta "$VERSION"
          else
            python3 tools/upstream/bump-surfer-json.py "$VERSION"
          fi

      # The autopilot's pref refresh, computed from the verified tarball in its patch-check job,
      # so the suites run on the lines the bump will commit (spec upstream-bump-automation, 2).
      - name: Download the pref refresh (upstream autopilot)
        if: inputs.prefs-patch-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.prefs-patch-artifact }}
          path: ${{ runner.temp }}/prefs-refresh

      - name: Apply the pref refresh (upstream autopilot)
        id: prefs-refresh
        if: inputs.prefs-patch-artifact != ''
        run: |
          patch="$RUNNER_TEMP/prefs-refresh/prefs-refresh.patch"
          if [ -s "$patch" ]; then
            git apply --include=src/browser/branding/vimma/pref/firefox-branding.js "$patch"
            git diff --stat
          else
            echo "No pref refresh for this release"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc # exact Node pin (docs/runbook.md, "Bench baseline")
          cache: npm

      - name: npm ci
        run: npm ci

      # Before the Firefox download, so a harness bug fails in about a minute. The runner image
      # ships rustup (installs the toolchain pinned in rust-toolchain.toml) and Xvfb (package
      # xvfb). E2E_REQUIRE_*: the vimma-ctl and Xvfb tests must not skip here.
      - name: Build vimma-ctl (tools/vimma-ctl/rust-toolchain.toml)
        working-directory: tools/vimma-ctl
        run: rustup toolchain install && cargo build --locked

      - name: e2e harness tests (fake control server, real vimma-ctl and Xvfb)
        env:
          E2E_REQUIRE_CTL: "1"
          E2E_REQUIRE_XVFB: "1"
        run: npx --no -- vitest run tools/e2e/

      # Disk guards. Measured (PR #8): ~13 GB free before the download; the tarball (0.8 GB) and
      # tree (4.7 GB) leave ~8.3 GB once the tarball is deleted; build and tests then use 1.2 GB,
      # ending at 7.1 GB. Each guard asks for the step's use plus ~2 GB of margin.
      - name: Disk guard (download and unpack need ~6 GB)
        run: |
          df -h . | tail -1
          free=$(df --output=avail -BG . | tail -1 | tr -dc 0-9)
          if [ "$free" -lt 8 ]; then
            echo "::error::Only ${free} GB free; the Firefox source needs ~6 GB (ADR-010). Free space first, e.g. rm -rf /usr/local/lib/android (~9 GB)."
            exit 1
          fi

      # Surfer does not check the tarball: firefox-source.sh downloads it, compares it with
      # Mozilla's SHA512SUMS (a mismatch fails here), and only then lets Surfer unpack it without
      # history into a fresh engine/ with an empty repository, so `git apply` in `surfer import`
      # resolves paths inside engine/ (spec build-supply-chain, decision 3).
      - name: Firefox source tarball (surfer.json), verified and unpacked without history
        run: |
          tools/upstream/firefox-source.sh
          # The runner has ~7.5 GB free once unpacked; the 0.8 GB tarball is not needed again.
          rm -f .surfer/engine/firefox-*.source.tar.xz
          df -h . | tail -1

      - name: Import our patches and sources
        id: import
        run: npm run import

      # Needs engine/ (upstream's unofficial brand), so it runs here; the CI job skips it.
      - name: Branding prefs keep upstream's (tools/branding/test)
        id: branding
        continue-on-error: ${{ steps.mode.outputs.beta == 'true' }}
        run: npx --no -- vitest run tools/branding/

      # The cfr provider and Safe Browsing lists we copy from upstream (docs/rebase.md, step 6):
      # a stale copy shadows upstream's. Fails with the line to paste.
      - name: Upstream pref copies are current (tools/upstream/upstream-prefs.mjs)
        id: upstream-prefs
        continue-on-error: ${{ steps.mode.outputs.beta == 'true' }}
        run: node tools/upstream/upstream-prefs.mjs

      - name: Disk guard (artifact build and tests need ~1.2 GB)
        run: |
          free=$(df --output=avail -BG . | tail -1 | tr -dc 0-9)
          if [ "$free" -lt 3 ]; then
            echo "::error::Only ${free} GB free; the artifact build and tests need ~1.2 GB (ADR-010). Free space first, e.g. rm -rf /usr/local/lib/android (~9 GB)."
            exit 1
          fi

      - name: Artifact build (tools/artifact-build)
        id: artifact-build
        run: node tools/artifact-build/artifact-build.mjs

      # browser_vimma_control.js runs the vimma-ctl built above (target/debug) against the live
      # server; without it the task skips, and VIMMA_REQUIRE_CTL=1 makes that skip a failure.
      # Beta mode also writes mozlog's TBPL log for suite-results.json: mach prints its own format,
      # without the TEST-UNEXPECTED-* lines.
      - name: Mochitests (npm run mochitest -- --artifact tests/browser/)
        id: mochitest
        continue-on-error: ${{ steps.mode.outputs.beta == 'true' }}
        env:
          BETA: ${{ steps.mode.outputs.beta }}
        run: |
          log=()
          if [ "$BETA" = true ]; then log=("--log-tbpl=$RUNNER_TEMP/mochitest.tbpl.log"); fi
          npm run mochitest -- --artifact --setenv=VIMMA_REQUIRE_CTL=1 "${log[@]}" tests/browser/
          df -h . | tail -1
          du -sh engine engine/obj-artifact ~/.mozbuild 2>/dev/null || true

      # Spec m0-e2e-harness. The scenarios run here on the artifact build under Xvfb, with
      # screenshots compared at 0.5 %; pending ones are a ::notice::, never a pass. CI is set, so
      # --update-baselines is refused: a baseline changes only in a reviewed commit.
      - name: e2e scenarios (npm run e2e -- --artifact)
        id: e2e
        continue-on-error: ${{ steps.mode.outputs.beta == 'true' }}
        env:
          BETA: ${{ steps.mode.outputs.beta }}
        run: |
          report=()
          if [ "$BETA" = true ]; then report=(--report-json "$RUNNER_TEMP/e2e-report.json"); fi
          npm run e2e -- --artifact "${report[@]}"

      # Spec site-compat, "Snapshot layer": the recorded pages in tests/e2e/fixtures/sites/ replayed
      # offline (every host but 127.0.0.1 unreachable) with the site suite's checks. Fails when a
      # check that passed on the recording does not pass now. Never a live site from here.
      - name: Site snapshot gate (npm run sites -- --offline)
        id: sites-offline
        continue-on-error: ${{ steps.mode.outputs.beta == 'true' }}
        run: npm run sites -- --offline --artifact --out site-compat-offline/

      - name: Upload site-compat-offline/ (the snapshot gate's report and screenshots)
        if: failure() || (steps.mode.outputs.beta == 'true' && steps.sites-offline.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-compat-offline
          path: site-compat-offline/
          if-no-files-found: ignore
          retention-days: 7

      # The actual and diff screenshots of a failed comparison (tools/e2e/screenshot.mjs), for
      # judging a regression or taking a new baseline from the runner's fonts (runbook).
      - name: Upload e2e-output/ (screenshots of failed comparisons)
        if: failure() || (steps.mode.outputs.beta == 'true' && steps.e2e.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-output
          path: e2e-output/
          if-no-files-found: ignore
          retention-days: 7

      # Beta mode only, after every step (a failed build step skips the suites; that is recorded
      # too). suite-results.mjs exits 1 when any step did not succeed, so the run fails once
      # everything reported, unless the caller passed fail-on-findings: false (the canary, whose
      # findings go to its issue). A failed import or artifact build still fails the job.
      - name: suite-results.json (Beta mode, tools/upstream/suite-results.mjs)
        id: suite-results
        if: "!cancelled() && steps.mode.outputs.beta == 'true'"
        env:
          VERSION: ${{ inputs.firefox-version }}
          STEPS: ${{ toJSON(steps) }}
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        run: |
          status=0
          node tools/upstream/suite-results.mjs --version "$VERSION" \
            --mochitest-log "$RUNNER_TEMP/mochitest.tbpl.log" \
            --e2e-report "$RUNNER_TEMP/e2e-report.json" --out "$RUNNER_TEMP/suite-results.json" ||
            status=$?
          if [ "$status" -eq 1 ] && [ "$FAIL_ON_FINDINGS" = false ]; then
            echo "::notice::Findings recorded in suite-results.json; the caller reports them"
            status=0
          fi
          exit "$status"

      - name: Upload suite-results.json (Beta mode)
        if: "!cancelled() && steps.mode.outputs.beta == 'true'"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-results
          path: |
            ${{ runner.temp }}/suite-results.json
            ${{ runner.temp }}/e2e-report.json
          if-no-files-found: warn
          retention-days: 30
