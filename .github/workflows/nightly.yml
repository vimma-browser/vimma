# Spec m0-pipeline: full Linux x86_64 build, issue on failure. Spec build-supply-chain,
# decision 23: the nightly publishes no release; its package is the run's workflow artifact
# `vimma-nightly`, kept 7 days. The repository is public, so any signed-in GitHub user can
# download it from the run while it is kept.
# Spec build-supply-chain: it runs on the standard GitHub-hosted runner, never a self-hosted one
# (docs/security.md, B5), from Firefox source that tools/upstream/firefox-source.sh verifies and
# extracts in this job, and restores nothing from the Actions cache (B1, B2). Nothing runs,
# scheduled or manual, until the repository variable NIGHTLY_ENABLED is `true`; a manual run
# (workflow_dispatch) must also start from main. Measured time and disk, and how to switch it
# on: docs/runbook.md, "Full builds".
# Spec m6a-updater: the build has Firefox's updater (VIMMA_UPDATES=1), and the package is set to
# the nightly update channel, vimma-nightly, and checked with tools/update/check-build.mjs. The
# MAR step runs on every nightly as a check of the release's.
#
# Public nightlies (spec m6a-updater, decisions 42 and 43; build-supply-chain, decision 23's
# note): only while the repository variables NIGHTLY_RELEASE_ENABLED and UPDATES_ENABLED are both
# `true`, a nightly also goes to the rolling `nightly` pre-release and its update manifest:
#
#   mar-sign  update-publish.yml's mar-sign, called: signs the MAR on the nightly channel.
#   mar       no secret, read-only: checks the signed MAR as release.yml's mar does, and lists it
#             and the tarball, named by build ID, in SHA256SUMS.
#   sign      cosign keyless, id-token: write only, no repository code: signs SHA256SUMS as
#             nightly.yml at refs/heads/main, an identity release.yml's checks never accept.
#   publish   contents: write only, no repository code: uploads to the `nightly` pre-release
#             (created once, never Latest) and keeps the previous build's files.
#   manifest  update-publish.yml's nightly-prepare, nightly-sign and nightly-publish, called:
#             …/vimma-nightly/update.xml.
#
# Unchanged days (spec m6a-updater, decision 44): a scheduled run first compares main's commit
# and Firefox version with the build the `nightly` release's notes record (`changes`, no secret,
# contents: read). When they match it builds nothing and calls `manifest` with the recorded
# build, which re-signs the same offer under a new serial, so nightly installs never see a feed
# older than 7 days and are offered nothing new. A manual run always builds.
name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Decision 44: whether tonight builds. No secret and no environment, a read-only token, and
  # only `gh release view` and tools/update/nightly-change.mjs: it reads the rolling release's
  # notes and file names and compares them with the commit checked out here. A doubt builds.
  changes:
    if: >-
      vars.NIGHTLY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      build_id: ${{ steps.decide.outputs.build_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Any answer but the release (none yet, an API error) builds, as every night did before.
      - name: Decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          PUBLIC: ${{ vars.NIGHTLY_RELEASE_ENABLED == 'true' && vars.UPDATES_ENABLED == 'true' }}
        run: |
          release=()
          if gh release view nightly --json body,isDraft,isPrerelease,assets > "$RUNNER_TEMP/release.json"; then
            release=(--release "$RUNNER_TEMP/release.json")
          fi
          firefox=$(node -p 'require("./surfer.json").version.version')
          node tools/update/nightly-change.mjs --event "$EVENT" --public "$PUBLIC" --sha "$SHA" \
            --firefox "$firefox" "${release[@]}" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    # Manual runs only from main: a branch's edited nightly.yml must not get the secret. Manual
    # runs need NIGHTLY_ENABLED too: a build compiles in the Safe Browsing key. A scheduled run
    # builds only when `changes` found main changed; a manual run always builds.
    if: >-
      vars.NIGHTLY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule') &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.build == 'true')
    # The Safe Browsing key is a secret of the `build` environment, which only main may deploy
    # from (docs/security.md, B6): GitHub enforces that outside this file.
    environment: build
    runs-on: ubuntu-24.04
    # About 1.5 times the measured job, 124 min (docs/runbook.md, "Full builds"), well under
    # GitHub's 6 hours, so a hung build fails here with its own log and failure handling.
    timeout-minutes: 190
    # No write token here: npm, Surfer, mach and the mochitests run in this job. The failure
    # issue is a job of its own (`report`).
    permissions:
      contents: read
    # For a public nightly: the unsigned MAR's name and the build ID, for the jobs after it.
    outputs:
      mar: ${{ steps.mar.outputs.mar }}
      build_id: ${{ steps.mar.outputs.build_id }}
      firefox: ${{ steps.mar.outputs.firefox }}
    env:
      LOG: ${{ github.workspace }}/nightly.log
      # Firefox's updater with Vimma's channel, update host and certificates
      # (configs/common/mozconfig, spec m6a-updater §6); every mach call of this job reads it.
      VIMMA_UPDATES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # this job never pushes

      # No `cache` input: a build restores nothing from the Actions cache (B2).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: npm ci
        run: npm ci --ignore-scripts 2>&1 | tee -a "$LOG"

      # Before the download, so a runner image that shrank fails in seconds, not after an hour of
      # compiling. The build needs about 26 GB, the swap file 16 GB (runbook, "Full builds").
      - name: Disk guard (a full build and its swap file need about 42 GB)
        run: |
          df -h . | tail -1 | tee -a "$LOG"
          free=$(df --output=avail -BG . | tail -1 | tr -dc 0-9)
          if [ "$free" -lt 50 ]; then
            echo "::error::Only ${free} GB free; the build and its swap file need about 42 GB."
            exit 1
          fi

      # The Rust stage of the build peaks at 15.3 GB of the runner's 16 GB of memory plus 10.4 GB
      # of swap; without this file the first measured build was killed after 38 minutes
      # (docs/runbook.md, "Full builds").
      - name: Swap file (16 GB)
        run: |
          sudo fallocate -l 16G /vimma-swapfile
          sudo chmod 600 /vimma-swapfile
          sudo mkswap /vimma-swapfile > /dev/null
          sudo swapon /vimma-swapfile
          free -g

      # Verified against Mozilla's SHA512SUMS and extracted afresh in this job (B1, B2).
      - name: Firefox source (surfer.json), verified and freshly extracted
        run: tools/upstream/firefox-source.sh 2>&1 | tee -a "$LOG"
        shell: bash -o pipefail -e {0}

      # Spec m0-safebrowsing-key. The secret goes to a mode-600 file in RUNNER_TEMP (emptied by
      # the runner per job) through a shell builtin, so our steps never echo it nor put it on a
      # command line (the build itself passes it to the preprocessor; see the spec);
      # configs/common/mozconfig reads VIMMA_SAFEBROWSING_KEYFILE. It stays until every mach call
      # (build, tests, package) is done: mach re-reads the mozconfig, which fails on a missing file.
      - name: Safe Browsing key file
        env:
          SAFEBROWSING_API_KEY: ${{ secrets.SAFEBROWSING_API_KEY }}
        run: |
          if [ -z "$SAFEBROWSING_API_KEY" ]; then
            echo "::error::secret SAFEBROWSING_API_KEY is not set; a nightly must have the key"
            exit 1
          fi
          keyfile="$RUNNER_TEMP/vimma-safebrowsing.key"
          (umask 077 && printf '%s' "$SAFEBROWSING_API_KEY" > "$keyfile")
          echo "VIMMA_SAFEBROWSING_KEYFILE=$keyfile" >> "$GITHUB_ENV"

      - name: Import patches and our sources
        run: |
          set -o pipefail
          npm run import 2>&1 | tee -a "$LOG"

      # As release.yml (#563): buildid.h is written again when `./mach package` runs, and without a fixed
      # MOZ_BUILD_DATE it takes the time then, so the packaged application.ini (what the update
      # manifest offers) named a later build than the binary (what appinfo.appBuildID says) and
      # a release offered itself as an update. One UTC time for every mach call of this job.
      - name: Fix the build ID for every mach call
        run: echo "MOZ_BUILD_DATE=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"

      # `surfer import` needed engine/'s empty repository; mach must not see it: its taskgraph
      # hashes the files a repository tracks to find Mozilla's toolchains for --enable-bootstrap,
      # and finds none in an empty one. Without .git, engine/ is a source tarball to mach.
      - name: Build
        run: |
          set -o pipefail
          rm -rf engine/.git
          npx --no -- surfer build 2>&1 | tee -a "$LOG"

      - name: Smoke check
        run: |
          set -o pipefail
          # stdout alone, as release.yml: the sandbox's user-namespace diagnostic goes to stderr,
          # which goes to the log. pipefail fails the step on a failing or crashing binary.
          version=$(engine/obj-x86_64-pc-linux-gnu/dist/bin/vimma --version 2>>"$LOG" | tee -a "$LOG")
          # "Vimma <vimma> · Firefox <firefox>" from surfer.json (spec firefox-versions).
          expected=$(node tools/release/version-line.mjs)
          # A nightly that lost the Vimma brand (e.g. built `unofficial`) must not be published.
          [ "$version" = "$expected" ] || { echo "::error::--version is '$version', want '$expected'"; exit 1; }
          # appinfo.version is the Firefox version (spec m0-app-version); --version shows Vimma's.
          appver=$(sed -n 's/^Version=//p' engine/obj-x86_64-pc-linux-gnu/dist/bin/application.ini)
          firefox=$(node -p 'require("./surfer.json").version.version')
          [ "$appver" = "$firefox" ] || { echo "::error::app version is '$appver', want '$firefox'"; exit 1; }

      - name: Mochitests on the full build
        # PRs run them on an artifact build (e2e.yml, ADR-010), which skips what only a full
        # build has (skip-if = ["artifact"], e.g. browser_vimma_crash_reporter.js).
        env:
          VIMMA_EXPECT_SAFEBROWSING_KEY: "1" # browser_vimma_safebrowsing.js fails without it
        run: |
          set -o pipefail
          npm run mochitest -- tests/browser/ 2>&1 | tee -a "$LOG"

      - name: Package
        # `./mach package`, not `surfer package`: Surfer's then reads locales/supported-languages,
        # which this repo does not have, and builds a MAR for an updater we compile out
        # (spec m6-packaging, Findings). Release packages: release.yml.
        run: |
          set -o pipefail
          rm -rf dist && mkdir dist
          rm -f engine/obj-x86_64-pc-linux-gnu/dist/vimma-*.tar.xz
          (cd engine && ./mach package) 2>&1 | tee -a "$LOG"
          cp engine/obj-x86_64-pc-linux-gnu/dist/vimma-*.en-US.linux-x86_64.tar.xz dist/
          ls -l dist
          # the build ID the binary runs with is the one its application.ini names (#563)
          unpacked=$(mktemp -d)
          tar -xJf dist/vimma-*.en-US.linux-x86_64.tar.xz -C "$unpacked"
          node tools/release/build-id.mjs --binary "$unpacked/vimma/vimma" --ini "$unpacked/vimma/application.ini"
          rm -rf "$unpacked"

      # Spec m6a-updater §1: the build's channel stays vimma, which picks the updater's
      # certificates; the package gets the nightly's own update channel, in both files that
      # name it. Then sub-PR 2's done criteria on what is uploaded: it asks updates.vimma.dev,
      # both channel files say vimma-nightly, and the updater embeds Vimma's certificates and
      # none of Mozilla's.
      - name: Nightly update channel, and the updater checked
        run: |
          set -o pipefail
          tarball=$(echo dist/vimma-*.en-US.linux-x86_64.tar.xz)
          node tools/update/channel.mjs --tarball "$tarball" --channel vimma-nightly --out "$tarball.new"
          mv "$tarball.new" "$tarball"
          unpacked=$(mktemp -d)
          tar -xJf "$tarball" -C "$unpacked"
          node tools/update/check-build.mjs "$unpacked/vimma" --channel vimma-nightly 2>&1 | tee -a "$LOG"
          rm -rf "$unpacked"

      # release.yml's MAR step, with this build's host mar and Mozilla's make_full_update.sh, so
      # a change that breaks it fails a nightly before it can fail a release. For a public nightly
      # it is kept, unsigned, with its zeroed placeholder and named by the build ID (the rolling
      # release replaces its files; spec m6a-updater §7); otherwise it is thrown away. Never in
      # dist/: the package artifact stays the tarball alone.
      - name: Complete MAR, for the nightly channel
        id: mar
        env:
          PUBLIC: ${{ vars.NIGHTLY_RELEASE_ENABLED == 'true' && vars.UPDATES_ENABLED == 'true' }}
        run: |
          set -o pipefail
          tarball=$(echo dist/vimma-*.en-US.linux-x86_64.tar.xz)
          build_id=$(tar -xJOf "$tarball" vimma/application.ini | sed -n 's/^BuildID=//p')
          [[ $build_id =~ ^[0-9]{14}$ ]] || { echo "::error::the tarball's build ID is '$build_id'"; exit 1; }
          # The smoke check compared it with surfer.json; the release notes record it (decision 44).
          firefox=$(tar -xJOf "$tarball" vimma/application.ini | sed -n 's/^Version=//p')
          mar="vimma-nightly-$build_id-linux-x86_64.complete.mar"
          tools=$(mktemp -d)
          cp engine/obj-x86_64-pc-linux-gnu/dist/host/bin/mar engine/tools/update-packaging/make_full_update.sh \
            engine/tools/update-packaging/common.sh "$tools/"
          mkdir -p mar
          node tools/update/mar.mjs build --tarball "$tarball" \
            --tools "$tools" --channel vimma-nightly --out "mar/$mar" 2>&1 | tee -a "$LOG"
          rm -rf "$tools"
          if [ "$PUBLIC" = true ]; then
            echo "mar=$mar" >> "$GITHUB_OUTPUT"
            echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
            echo "firefox=$firefox" >> "$GITHUB_OUTPUT"
          else
            rm -rf mar
          fi

      # As release.yml's build: the host mar, Mozilla's update scripts' tools and signmar with
      # the NSS libraries it loads from beside it, for the mar job's checks.
      - name: MAR tools for the mar job
        if: vars.NIGHTLY_RELEASE_ENABLED == 'true' && vars.UPDATES_ENABLED == 'true'
        run: |
          set -o pipefail
          obj=engine/obj-x86_64-pc-linux-gnu
          rm -rf mar-tools && mkdir -p mar-tools
          cp "$obj/dist/host/bin/mar" "$obj/dist/bin/signmar" mar-tools/
          for lib in $(ldd "$obj/dist/bin/signmar" | awk -v d="$obj/dist/bin/" 'index($3, d) == 1 { print $3 }') \
            "$obj/dist/bin/libsoftokn3.so" "$obj/dist/bin/libfreeblpriv3.so"; do
            cp "$lib" mar-tools/
          done
          ls -l mar-tools

      - name: Upload the unsigned MAR
        if: vars.NIGHTLY_RELEASE_ENABLED == 'true' && vars.UPDATES_ENABLED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mar-unsigned
          path: mar/
          retention-days: 7
          if-no-files-found: error

      - name: Upload the MAR tools
        if: vars.NIGHTLY_RELEASE_ENABLED == 'true' && vars.UPDATES_ENABLED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mar-tools
          path: mar-tools/
          retention-days: 7
          if-no-files-found: error

      - name: Delete the Safe Browsing key file
        if: always()
        run: rm -f "$RUNNER_TEMP/vimma-safebrowsing.key"

      # Kept a week, then deleted by GitHub. Not a release: no release page, no tag. The
      # repository is public, so anyone signed in to GitHub can still download it from the run.
      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vimma-nightly
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0 # already xz

      # Masking doesn't cover artifacts or issue bodies, which go public with the repo: scrub the
      # key from the log before either sees it.
      - name: Redact the Safe Browsing key from the log
        if: always()
        env:
          SB_KEY: ${{ secrets.SAFEBROWSING_API_KEY }}
        run: |
          if [ -n "${SB_KEY:-}" ] && [ -f "$LOG" ]; then
            sed -i "s|${SB_KEY}|[redacted]|g" "$LOG"
          fi

      # cancelled(): a build stopped by timeout-minutes is cancelled, not failed.
      - name: Upload log
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-log
          path: nightly.log
          retention-days: 14

  # The update key signs the MAR in update-publish.yml's mar-sign job, called here as release.yml
  # calls it: its token names update-publish.yml at refs/heads/main, the one workflow Google
  # Cloud admits for the key (docs/runbook.md, "Update signing keys and the update host", step
  # 7b), and the caller, nightly.yml on main, fixes the channel to vimma-nightly. These
  # permissions are a ceiling, not a grant (release.yml's mar-sign says why): the one job that
  # runs in the call asks only for its OIDC token.
  mar-sign:
    needs: build
    if: >-
      vars.NIGHTLY_ENABLED == 'true' && github.repository == 'vimma-browser/vimma' &&
      github.ref == 'refs/heads/main' && vars.NIGHTLY_RELEASE_ENABLED == 'true' &&
      vars.UPDATES_ENABLED == 'true' && needs.build.outputs.mar != ''
    permissions:
      id-token: write # GitHub OIDC for Cloud KMS, in update-publish.yml's mar-sign job
      actions: write # ceiling only: update-publish.yml's start, which never runs in a call
      contents: read # ceiling only: its prepare and publish jobs
      pull-requests: read # ceiling only: its prepare
      issues: write # ceiling only: its failure
    uses: ./.github/workflows/update-publish.yml
    with:
      mar: ${{ needs.build.outputs.mar }}

  # As release.yml's mar job, with no secret and a read-only token: the signed MAR differs from
  # the build's only in its signature, verifies under the committed certificates (mar.mjs and
  # Mozilla's signmar), is on the nightly channel and Firefox's version, and installs exactly the
  # nightly tarball's files. Then SHA256SUMS lists it and the tarball, both named by build ID.
  # It runs whenever the build succeeded and the run was not cancelled, so a skipped or failed
  # mar-sign fails here, loudly.
  mar:
    needs: [build, mar-sign]
    if: >-
      !cancelled() && vars.NIGHTLY_ENABLED == 'true' && github.repository == 'vimma-browser/vimma' &&
      github.ref == 'refs/heads/main' && vars.NIGHTLY_RELEASE_ENABLED == 'true' &&
      vars.UPDATES_ENABLED == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MAR: ${{ needs.build.outputs.mar }}
      BUILD_ID: ${{ needs.build.outputs.build_id }}
      MAR_SIGN: ${{ needs.mar-sign.result }}
    steps:
      - name: The MAR was signed
        run: |
          [ "$MAR_SIGN" = success ] \
            || { echo "::error::mar-sign ended '$MAR_SIGN', so the MAR is not signed and nothing is published"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vimma-nightly
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mar-unsigned
          path: mar-unsigned

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mar-signed
          path: mar-signed

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mar-tools
          path: mar-tools

      - name: Check the signed MAR
        run: |
          [[ $BUILD_ID =~ ^[0-9]{14}$ ]] || { echo "::error::'$BUILD_ID' is not a build ID"; exit 1; }
          [ "$MAR" = "vimma-nightly-$BUILD_ID-linux-x86_64.complete.mar" ] \
            || { echo "::error::'$MAR' is not build $BUILD_ID's complete MAR"; exit 1; }
          [ -f "mar-signed/$MAR" ] || { echo "::error::mar-sign left no signed MAR"; exit 1; }
          node tools/update/mar.mjs same-content --placeholder "mar-unsigned/$MAR" --signed "mar-signed/$MAR"
          firefox=$(node -p 'require("./surfer.json").version.version')
          node tools/update/mar.mjs verify --mar "mar-signed/$MAR" --cert configs/updater/primary.der --cert configs/updater/secondary.der --channel vimma-nightly --product-version "$firefox"
          sudo apt-get update -q
          sudo apt-get install -y -q libnss3-tools
          chmod 755 mar-tools/signmar
          # A database per slot, as release.yml's (spec decision 39).
          for slot in primary secondary; do
            db=$(mktemp -d)
            certutil -N -d "sql:$db" --empty-password
            certutil -A -n "$slot" -t ,, -i "configs/updater/$slot.der" -d "sql:$db"
            LD_LIBRARY_PATH=mar-tools mar-tools/signmar -d "sql:$db" -n "$slot" -v "mar-signed/$MAR"
          done
          echo "signmar: $MAR verifies under primary.der and secondary.der"

      - name: The MAR installs the nightly tarball's files
        run: |
          chmod 755 mar-tools/mar
          from_mar=$(mktemp -d)
          from_tarball=$(mktemp -d)
          root=$PWD
          (cd "$from_mar" && "$root/mar-tools/mar" -x "$root/mar-signed/$MAR")
          find "$from_mar" -type f -print0 | while IFS= read -r -d '' f; do
            xz -dc "$f" > "$f.plain" && mv "$f.plain" "$f"
          done
          rm "$from_mar/updatev3.manifest"
          tar -xJf dist/vimma-*.en-US.linux-x86_64.tar.xz -C "$from_tarball"
          find "$from_tarball" -type d -empty -delete
          diff -r --no-dereference "$from_mar" "$from_tarball/vimma"
          echo "$MAR installs the $(find "$from_mar" -type f | wc -l) files of the nightly tarball"

      - name: The nightly's files and SHA256SUMS
        run: |
          rm -rf release && mkdir release
          cp dist/vimma-*.en-US.linux-x86_64.tar.xz "release/vimma-nightly-$BUILD_ID-linux-x86_64.tar.xz"
          cp "mar-signed/$MAR" release/
          (cd release && sha256sum vimma-nightly-* > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-release
          path: release/
          retention-days: 7
          compression-level: 0 # already compressed
          if-no-files-found: error

  # cosign keyless, as release.yml's sign: the certificate names nightly.yml at refs/heads/main,
  # which release.yml's identity check (IDENTITY_REGEXP) and the release manifest refuse. It runs
  # no repository code. Its OIDC token names nightly.yml, which Google Cloud's condition on the
  # update key refuses.
  sign:
    needs: [build, mar]
    if: >-
      vars.NIGHTLY_ENABLED == 'true' && github.repository == 'vimma-browser/vimma' &&
      github.ref == 'refs/heads/main' && vars.NIGHTLY_RELEASE_ENABLED == 'true' &&
      vars.UPDATES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write # cosign keyless (Sigstore), nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-release
          path: release

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign SHA256SUMS
        run: |
          (cd release && sha256sum -c SHA256SUMS)
          cosign sign-blob --yes --bundle release/SHA256SUMS.sigstore.json release/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-signature
          path: release/SHA256SUMS.sigstore.json
          retention-days: 7
          if-no-files-found: error

  # The one job that can write contents. It checks nothing out and runs no repository code: gh,
  # curl, sha256sum and the files the jobs before it checked. The rolling `nightly` release is a
  # pre-release, so it is never Latest, starts no workflow listening for published releases
  # (GITHUB_TOKEN's events start none anyway), and update-publish.yml's release manifest refuses
  # it. Its tag is made once, at the first public nightly's commit, and never moved: GitHub may
  # refuse GITHUB_TOKEN a ref update that brings in workflow changes, and the notes name each
  # build's commit. The files of the previous build and of the build the published manifest
  # offers stay, so a client that read that manifest can still download its MAR (spec
  # m6a-updater §7).
  publish:
    needs: [build, sign]
    if: >-
      vars.NIGHTLY_ENABLED == 'true' && github.repository == 'vimma-browser/vimma' &&
      github.ref == 'refs/heads/main' && vars.NIGHTLY_RELEASE_ENABLED == 'true' &&
      vars.UPDATES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # the rolling nightly release: create it once, replace its files
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      BUILD_ID: ${{ needs.build.outputs.build_id }}
      FIREFOX: ${{ needs.build.outputs.firefox }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-release
          path: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-signature
          path: release

      - name: Check the files against SHA256SUMS
        run: |
          cd release
          sha256sum -c SHA256SUMS
          # Nothing is uploaded that SHA256SUMS does not list, but the sums and their signature.
          for f in *; do
            case "$f" in
              SHA256SUMS|SHA256SUMS.sigstore.json) ;;
              *) awk -v f="$f" '$2 == f { found = 1 } END { exit !found }' SHA256SUMS \
                   || { echo "::error::$f is not in SHA256SUMS"; exit 1; } ;;
            esac
          done
          ls -l SHA256SUMS SHA256SUMS.sigstore.json

      # A draft or a full release named nightly is someone's mistake, never overwritten: a full
      # one would be Latest. gh release view finds drafts too. A newer build already on the
      # release means this is a re-run of an older night: it must not replace that build's sums.
      # The notes' first sentence is the record the next night's `changes` compares main with
      # (tools/update/nightly-change.mjs); it is written last, after the files are up.
      - name: Upload to the rolling nightly release
        run: |
          [[ $BUILD_ID =~ ^[0-9]{14}$ ]] || { echo "::error::'$BUILD_ID' is not a build ID"; exit 1; }
          [[ $SHA =~ ^[0-9a-f]{40}$ ]] || { echo "::error::'$SHA' is not a commit"; exit 1; }
          [[ $FIREFOX =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([ab][0-9]+)?$ ]] || { echo "::error::'$FIREFOX' is not a Firefox version"; exit 1; }
          notes="Nightly build $BUILD_ID of main at $SHA, Firefox $FIREFOX. Built from main on each night it changed and checked by CI only: not a release. SHA256SUMS lists this build's files; check a download with: cosign verify-blob --bundle SHA256SUMS.sigstore.json --certificate-identity https://github.com/vimma-browser/vimma/.github/workflows/nightly.yml@refs/heads/main --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS && sha256sum -c --ignore-missing SHA256SUMS"
          if state=$(gh release view nightly --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"' 2> view.err); then
            [ "$state" = "false true" ] \
              || { echo "::error::the nightly release is not a public pre-release (isDraft isPrerelease: $state); nothing was uploaded"; exit 1; }
            newest=$(gh release view nightly --json assets --jq '.assets[].name' \
              | sed -n 's/^vimma-nightly-\([0-9]\{14\}\)-linux-x86_64\..*$/\1/p' | sort | tail -n 1)
            if [ -n "$newest" ] && [ "$newest" -gt "$BUILD_ID" ]; then
              echo "::error::the nightly release already has build $newest, newer than $BUILD_ID; nothing was uploaded"
              exit 1
            fi
          else
            grep -q 'release not found' view.err \
              || { echo "::error::could not read the nightly release: $(cat view.err)"; exit 1; }
            gh release create nightly --prerelease --latest=false --target "$SHA" --title "Vimma nightly" --notes "$notes"
          fi
          gh release upload nightly release/* --clobber
          gh release edit nightly --notes "$notes"

      # Kept: this build, the one before it, and the one the published nightly manifest offers
      # (its manifest may have failed since); never a newer build. When the update host does not
      # answer, nothing is removed.
      - name: Remove the files of older builds
        run: |
          url=https://updates.vimma.dev/updates/browser/Linux_x86_64-gcc3/vimma-nightly/update.xml
          code=$(curl -sS --proto =https --retry 3 -o live.xml -w '%{http_code}' "$url") || code=000
          case "$code" in
            200) live=$(sed -n 's/.* buildID="\([0-9]\{14\}\)".*/\1/p' live.xml | head -n 1) ;;
            404) live="" ;;
            *) echo "::warning::$url answered $code; no file removed"; exit 0 ;;
          esac
          names=$(gh release view nightly --json assets --jq '.assets[].name')
          id_of() { printf '%s\n' "$1" | sed -n 's/^vimma-nightly-\([0-9]\{14\}\)-linux-x86_64\..*$/\1/p'; }
          previous=$(for n in $names; do id_of "$n"; done | sort -u | awk -v c="$BUILD_ID" '$1 < c' | tail -n 1)
          for n in $names; do
            id=$(id_of "$n")
            [ -n "$id" ] && [ "$id" -lt "$BUILD_ID" ] && [ "$id" != "$previous" ] && [ "$id" != "$live" ] || continue
            gh release delete-asset nightly "$n" --yes
          done

  # nightly-prepare, nightly-sign and nightly-publish in update-publish.yml: the nightly
  # channel's manifest, from the files now on the nightly release. The permissions are the same
  # ceiling as mar-sign's. On an unchanged scheduled day (decision 44) no build ran: it signs
  # the build `changes` read from the release again, under a new serial, with every check a
  # build's manifest gets. A manual run never takes that path: it always builds.
  manifest:
    needs: [changes, build, publish]
    if: >-
      !cancelled() && vars.NIGHTLY_ENABLED == 'true' && github.repository == 'vimma-browser/vimma' &&
      github.ref == 'refs/heads/main' && vars.NIGHTLY_RELEASE_ENABLED == 'true' &&
      vars.UPDATES_ENABLED == 'true' && needs.changes.result == 'success' &&
      ((needs.build.result == 'success' && needs.publish.result == 'success') ||
      (github.event_name == 'schedule' && needs.changes.outputs.build == 'false' &&
      needs.build.result == 'skipped' && needs.changes.outputs.build_id != ''))
    permissions:
      id-token: write # GitHub OIDC for Cloud KMS, in update-publish.yml's nightly-sign job
      actions: write # ceiling only: update-publish.yml's start, which never runs in a call
      contents: read # its nightly-prepare and nightly-publish jobs
      pull-requests: read # ceiling only: its prepare
      issues: write # ceiling only: its failure
    uses: ./.github/workflows/update-publish.yml
    with:
      nightly: ${{ needs.build.result == 'success' && needs.build.outputs.build_id || needs.changes.outputs.build_id }}

  # Reads only the log the build job uploaded after scrubbing the key from it; it has no secret.
  # Any job's failure opens or updates the issue; only the build's leaves a log.
  report:
    needs: [changes, build, mar-sign, mar, sign, publish, manifest]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # create or comment on the one open `nightly-failure` issue, and its label
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-log
          path: nightly-log
        continue-on-error: true # a build that stopped before its log upload leaves none

      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create nightly-failure --color B60205 \
            --description "nightly.yml failed" --force
          {
            echo "Nightly run failed: ${RUN_URL} (the build's full log, if it got that far, is the"
            echo "run's \`nightly-log\` artifact)."
            echo
            echo "Last 150 log lines:"
            echo
            echo '```text'
            # The build job redacted the log before uploading it; also drop lines naming the key
            # define. Backticks are escaped so no log line can close the fence and render as
            # Markdown (mentions, links, images).
            if [ -s nightly-log/nightly.log ]; then
              tail -n 150 nightly-log/nightly.log \
                | grep -v -i 'safebrowsing_api_key\|safebrowsing-api-key' \
                | sed 's/`/\\`/g' || true
            else
              echo "(no log)"
            fi
            echo '```'
          } > issue.md
          open=$(gh issue list --label nightly-failure --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file issue.md
          else
            gh issue create --title "Nightly build failed $(date -u +%Y-%m-%d)" \
              --label nightly-failure --body-file issue.md
          fi
