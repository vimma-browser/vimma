# Spec m0-pipeline: full Linux x86_64 build, issue on failure. Spec build-supply-chain,
# decision 23: the nightly publishes no release; its package is the run's workflow artifact
# `vimma-nightly`, kept 7 days. The repository is public, so any signed-in GitHub user can
# download it from the run while it is kept.
# Spec build-supply-chain: it runs on the standard GitHub-hosted runner, never a self-hosted one
# (docs/security.md, B5), from Firefox source that tools/upstream/firefox-source.sh verifies and
# extracts in this job, and restores nothing from the Actions cache (B1, B2). Nothing runs,
# scheduled or manual, until the repository variable NIGHTLY_ENABLED is `true`; a manual run
# (workflow_dispatch) must also start from main. Measured time and disk, and how to switch it
# on: docs/runbook.md, "Full builds".
# Spec m6a-updater: the build has Firefox's updater (VIMMA_UPDATES=1), and the package is set to
# the nightly update channel, vimma-nightly, and checked with tools/update/check-build.mjs. The
# nightly's MAR and manifest are neither signed nor published until public nightly releases
# start (decision 23); the MAR step runs here as a check of the release's.
name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  build:
    # Manual runs only from main: a branch's edited nightly.yml must not get the secret. Manual
    # runs need NIGHTLY_ENABLED too: a build compiles in the Safe Browsing key.
    if: >-
      vars.NIGHTLY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule')
    # The Safe Browsing key is a secret of the `build` environment, which only main may deploy
    # from (docs/security.md, B6): GitHub enforces that outside this file.
    environment: build
    runs-on: ubuntu-24.04
    # About 1.5 times the measured job, 124 min (docs/runbook.md, "Full builds"), well under
    # GitHub's 6 hours, so a hung build fails here with its own log and failure handling.
    timeout-minutes: 190
    # No write token here: npm, Surfer, mach and the mochitests run in this job. The failure
    # issue is a job of its own (`report`).
    permissions:
      contents: read
    env:
      LOG: ${{ github.workspace }}/nightly.log
      # Firefox's updater with Vimma's channel, update host and certificates
      # (configs/common/mozconfig, spec m6a-updater §6); every mach call of this job reads it.
      VIMMA_UPDATES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # this job never pushes

      # No `cache` input: a build restores nothing from the Actions cache (B2).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: npm ci
        run: npm ci --ignore-scripts 2>&1 | tee -a "$LOG"

      # Before the download, so a runner image that shrank fails in seconds, not after an hour of
      # compiling. The build needs about 26 GB, the swap file 16 GB (runbook, "Full builds").
      - name: Disk guard (a full build and its swap file need about 42 GB)
        run: |
          df -h . | tail -1 | tee -a "$LOG"
          free=$(df --output=avail -BG . | tail -1 | tr -dc 0-9)
          if [ "$free" -lt 50 ]; then
            echo "::error::Only ${free} GB free; the build and its swap file need about 42 GB."
            exit 1
          fi

      # The Rust stage of the build peaks at 15.3 GB of the runner's 16 GB of memory plus 10.4 GB
      # of swap; without this file the first measured build was killed after 38 minutes
      # (docs/runbook.md, "Full builds").
      - name: Swap file (16 GB)
        run: |
          sudo fallocate -l 16G /vimma-swapfile
          sudo chmod 600 /vimma-swapfile
          sudo mkswap /vimma-swapfile > /dev/null
          sudo swapon /vimma-swapfile
          free -g

      # Verified against Mozilla's SHA512SUMS and extracted afresh in this job (B1, B2).
      - name: Firefox source (surfer.json), verified and freshly extracted
        run: tools/upstream/firefox-source.sh 2>&1 | tee -a "$LOG"
        shell: bash -o pipefail -e {0}

      # Spec m0-safebrowsing-key. The secret goes to a mode-600 file in RUNNER_TEMP (emptied by
      # the runner per job) through a shell builtin, so our steps never echo it nor put it on a
      # command line (the build itself passes it to the preprocessor; see the spec);
      # configs/common/mozconfig reads VIMMA_SAFEBROWSING_KEYFILE. It stays until every mach call
      # (build, tests, package) is done: mach re-reads the mozconfig, which fails on a missing file.
      - name: Safe Browsing key file
        env:
          SAFEBROWSING_API_KEY: ${{ secrets.SAFEBROWSING_API_KEY }}
        run: |
          if [ -z "$SAFEBROWSING_API_KEY" ]; then
            echo "::error::secret SAFEBROWSING_API_KEY is not set; a nightly must have the key"
            exit 1
          fi
          keyfile="$RUNNER_TEMP/vimma-safebrowsing.key"
          (umask 077 && printf '%s' "$SAFEBROWSING_API_KEY" > "$keyfile")
          echo "VIMMA_SAFEBROWSING_KEYFILE=$keyfile" >> "$GITHUB_ENV"

      - name: Import patches and our sources
        run: |
          set -o pipefail
          npm run import 2>&1 | tee -a "$LOG"

      # As release.yml (#563): buildid.h is written again when `./mach package` runs, and without a fixed
      # MOZ_BUILD_DATE it takes the time then, so the packaged application.ini (what the update
      # manifest offers) named a later build than the binary (what appinfo.appBuildID says) and
      # a release offered itself as an update. One UTC time for every mach call of this job.
      - name: Fix the build ID for every mach call
        run: echo "MOZ_BUILD_DATE=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"

      # `surfer import` needed engine/'s empty repository; mach must not see it: its taskgraph
      # hashes the files a repository tracks to find Mozilla's toolchains for --enable-bootstrap,
      # and finds none in an empty one. Without .git, engine/ is a source tarball to mach.
      - name: Build
        run: |
          set -o pipefail
          rm -rf engine/.git
          npx --no -- surfer build 2>&1 | tee -a "$LOG"

      - name: Smoke check
        run: |
          set -o pipefail
          # stdout alone, as release.yml: the sandbox's user-namespace diagnostic goes to stderr,
          # which goes to the log. pipefail fails the step on a failing or crashing binary.
          version=$(engine/obj-x86_64-pc-linux-gnu/dist/bin/vimma --version 2>>"$LOG" | tee -a "$LOG")
          # "Vimma <vimma> · Firefox <firefox>" from surfer.json (spec firefox-versions).
          expected=$(node tools/release/version-line.mjs)
          # A nightly that lost the Vimma brand (e.g. built `unofficial`) must not be published.
          [ "$version" = "$expected" ] || { echo "::error::--version is '$version', want '$expected'"; exit 1; }
          # appinfo.version is the Firefox version (spec m0-app-version); --version shows Vimma's.
          appver=$(sed -n 's/^Version=//p' engine/obj-x86_64-pc-linux-gnu/dist/bin/application.ini)
          firefox=$(node -p 'require("./surfer.json").version.version')
          [ "$appver" = "$firefox" ] || { echo "::error::app version is '$appver', want '$firefox'"; exit 1; }

      - name: Mochitests on the full build
        # PRs run them on an artifact build (e2e.yml, ADR-010), which skips what only a full
        # build has (skip-if = ["artifact"], e.g. browser_vimma_crash_reporter.js).
        env:
          VIMMA_EXPECT_SAFEBROWSING_KEY: "1" # browser_vimma_safebrowsing.js fails without it
        run: |
          set -o pipefail
          npm run mochitest -- tests/browser/ 2>&1 | tee -a "$LOG"

      - name: Package
        # `./mach package`, not `surfer package`: Surfer's then reads locales/supported-languages,
        # which this repo does not have, and builds a MAR for an updater we compile out
        # (spec m6-packaging, Findings). Release packages: release.yml.
        run: |
          set -o pipefail
          rm -rf dist && mkdir dist
          rm -f engine/obj-x86_64-pc-linux-gnu/dist/vimma-*.tar.xz
          (cd engine && ./mach package) 2>&1 | tee -a "$LOG"
          cp engine/obj-x86_64-pc-linux-gnu/dist/vimma-*.en-US.linux-x86_64.tar.xz dist/
          ls -l dist
          # the build ID the binary runs with is the one its application.ini names (#563)
          unpacked=$(mktemp -d)
          tar -xJf dist/vimma-*.en-US.linux-x86_64.tar.xz -C "$unpacked"
          node tools/release/build-id.mjs --binary "$unpacked/vimma/vimma" --ini "$unpacked/vimma/application.ini"
          rm -rf "$unpacked"

      # Spec m6a-updater §1: the build's channel stays vimma, which picks the updater's
      # certificates; the package gets the nightly's own update channel, in both files that
      # name it. Then sub-PR 2's done criteria on what is uploaded: it asks updates.vimma.dev,
      # both channel files say vimma-nightly, and the updater embeds Vimma's certificates and
      # none of Mozilla's.
      - name: Nightly update channel, and the updater checked
        run: |
          set -o pipefail
          tarball=$(echo dist/vimma-*.en-US.linux-x86_64.tar.xz)
          node tools/update/channel.mjs --tarball "$tarball" --channel vimma-nightly --out "$tarball.new"
          mv "$tarball.new" "$tarball"
          unpacked=$(mktemp -d)
          tar -xJf "$tarball" -C "$unpacked"
          node tools/update/check-build.mjs "$unpacked/vimma" --channel vimma-nightly 2>&1 | tee -a "$LOG"
          rm -rf "$unpacked"

      # release.yml's MAR step, with this build's host mar and Mozilla's make_full_update.sh, so
      # a change that breaks it fails a nightly before it can fail a release. Not kept: a
      # nightly MAR is neither signed nor offered until public nightly releases (decision 23).
      - name: Complete MAR (a check of the release's MAR step; not kept)
        run: |
          set -o pipefail
          tools=$(mktemp -d)
          cp engine/obj-x86_64-pc-linux-gnu/dist/host/bin/mar engine/tools/update-packaging/make_full_update.sh \
            engine/tools/update-packaging/common.sh "$tools/"
          node tools/update/mar.mjs build --tarball "$(echo dist/vimma-*.en-US.linux-x86_64.tar.xz)" \
            --tools "$tools" --channel vimma-nightly --out "$RUNNER_TEMP/nightly.complete.mar" 2>&1 | tee -a "$LOG"
          rm -rf "$tools" "$RUNNER_TEMP/nightly.complete.mar"

      - name: Delete the Safe Browsing key file
        if: always()
        run: rm -f "$RUNNER_TEMP/vimma-safebrowsing.key"

      # Kept a week, then deleted by GitHub. Not a release: no release page, no tag. The
      # repository is public, so anyone signed in to GitHub can still download it from the run.
      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vimma-nightly
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0 # already xz

      # Masking doesn't cover artifacts or issue bodies, which go public with the repo: scrub the
      # key from the log before either sees it.
      - name: Redact the Safe Browsing key from the log
        if: always()
        env:
          SB_KEY: ${{ secrets.SAFEBROWSING_API_KEY }}
        run: |
          if [ -n "${SB_KEY:-}" ] && [ -f "$LOG" ]; then
            sed -i "s|${SB_KEY}|[redacted]|g" "$LOG"
          fi

      # cancelled(): a build stopped by timeout-minutes is cancelled, not failed.
      - name: Upload log
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-log
          path: nightly.log
          retention-days: 14

  # Reads only the log the build job uploaded after scrubbing the key from it; it has no secret.
  report:
    needs: build
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # create or comment on the one open `nightly-failure` issue, and its label
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-log
          path: nightly-log
        continue-on-error: true # a build that stopped before its log upload leaves none

      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create nightly-failure --color B60205 \
            --description "nightly.yml failed" --force
          {
            echo "Nightly run failed: ${RUN_URL} (the build's full log, if it got that far, is the"
            echo "run's \`nightly-log\` artifact)."
            echo
            echo "Last 150 log lines:"
            echo
            echo '```text'
            # The build job redacted the log before uploading it; also drop lines naming the key
            # define. Backticks are escaped so no log line can close the fence and render as
            # Markdown (mentions, links, images).
            if [ -s nightly-log/nightly.log ]; then
              tail -n 150 nightly-log/nightly.log \
                | grep -v -i 'safebrowsing_api_key\|safebrowsing-api-key' \
                | sed 's/`/\\`/g' || true
            else
              echo "(no log)"
            fi
            echo '```'
          } > issue.md
          open=$(gh issue list --label nightly-failure --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file issue.md
          else
            gh issue create --title "Nightly build failed $(date -u +%Y-%m-%d)" \
              --label nightly-failure --body-file issue.md
          fi
