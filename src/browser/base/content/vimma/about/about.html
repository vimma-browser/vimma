<!-- about:vimma (spec: docs/specs/m5-about-vimma.md). Read-only: about.mjs fills each section
   - from AboutVimma.collect() on load and on Refresh; r (page.reload) reloads the page. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src chrome:; style-src chrome: 'unsafe-inline'; connect-src chrome:; img-src chrome:; object-src 'none'"
    />
    <title>about:vimma</title>
    <link rel="stylesheet" href="chrome://browser/skin/vimma/logo.css" />
    <link rel="stylesheet" href="chrome://browser/skin/vimma/about.css" />
    <script type="module" src="chrome://browser/content/vimma/about/about.mjs"></script>
  </head>
  <body>
    <header>
      <div class="vimma-logo" role="img" aria-label="Vimma">
        <span class="vimma-logo-mark" aria-hidden="true"></span>
        <span class="vimma-logo-wordmark" aria-hidden="true"></span>
      </div>
      <h1>about:vimma</h1>
      <button id="refresh" type="button">Refresh</button>
      <button id="copy" type="button">Copy redacted report</button>
      <span id="status" role="status"></span>
    </header>
    <main>
      <p class="hint">
        j / k scroll · r reloads · :bug copies a redacted report ·
        <a href="about:vimma-setup">set up add-ons and search again</a> (:setup)
      </p>
      <section id="version" aria-labelledby="version-heading">
        <h2 id="version-heading">Version</h2>
      </section>
      <section id="updates" aria-labelledby="updates-heading">
        <h2 id="updates-heading">Updates</h2>
      </section>
      <section id="patches" aria-labelledby="patches-heading">
        <h2 id="patches-heading">Upstream patches</h2>
      </section>
      <section id="modes" aria-labelledby="modes-heading">
        <h2 id="modes-heading">Modes</h2>
      </section>
      <section id="keys" aria-labelledby="keys-heading">
        <h2 id="keys-heading">Last key events</h2>
      </section>
      <section id="config" aria-labelledby="config-heading">
        <h2 id="config-heading">Config</h2>
      </section>
      <section id="search" aria-labelledby="search-heading">
        <h2 id="search-heading">Search</h2>
      </section>
      <section id="theme" aria-labelledby="theme-heading">
        <h2 id="theme-heading">Theme</h2>
      </section>
      <section id="workspaces" aria-labelledby="workspaces-heading">
        <h2 id="workspaces-heading">Workspaces</h2>
      </section>
      <section id="routes" aria-labelledby="routes-heading">
        <h2 id="routes-heading">Routing</h2>
      </section>
      <section id="control" aria-labelledby="control-heading">
        <h2 id="control-heading">Control socket</h2>
      </section>
      <section id="mcp" aria-labelledby="mcp-heading">
        <h2 id="mcp-heading">Agents (MCP)</h2>
      </section>
      <section id="window-manager" aria-labelledby="window-manager-heading">
        <h2 id="window-manager-heading">Window manager</h2>
      </section>
      <section id="firefox-keys" aria-labelledby="firefox-keys-heading">
        <h2 id="firefox-keys-heading">Firefox shortcuts on</h2>
      </section>
      <section id="bindings" aria-labelledby="bindings-heading">
        <h2 id="bindings-heading">Bindings</h2>
      </section>
    </main>
  </body>
</html>
