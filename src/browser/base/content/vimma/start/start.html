<!-- The Vimma start page (spec: docs/specs/start-page.md): the home page and the new-tab page.
   - Static: the one script sets the theme tokens and fills in the versions, and the page has
   - nothing to scroll. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src chrome:; style-src chrome: 'unsafe-inline'; img-src chrome:; object-src 'none'"
    />
    <title>Vimma</title>
    <link rel="stylesheet" href="chrome://browser/skin/vimma/logo.css" />
    <link rel="stylesheet" href="chrome://browser/skin/vimma/start.css" />
    <script type="module" src="chrome://browser/content/vimma/start/start.mjs"></script>
  </head>
  <body>
    <main>
      <div class="vimma-logo" role="img" aria-label="Vimma">
        <span class="vimma-logo-mark" aria-hidden="true"></span>
        <span class="vimma-logo-wordmark" aria-hidden="true"></span>
      </div>
      <p class="hint">
        <kbd>ctrl+b ?</kbd> keys · <kbd>:</kbd> commands · <kbd>f</kbd> hints ·
        <kbd>ctrl+b shift+b</kbd> bookmarks<span id="vimma-theme-tip" hidden>
          · <kbd>:theme</kbd> light/dark</span
        >
      </p>
    </main>
    <footer>
      <p class="version"><span id="vimma-version"></span> · <span id="firefox-version"></span></p>
    </footer>
  </body>
</html>
